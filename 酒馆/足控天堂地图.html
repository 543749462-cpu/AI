<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>足控天堂 Ⅱ · 事务所地图</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=ZCOOL+KuaiLe&family=Baloo+2:wght@700;800&display=swap');
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --cy:#6fd0f2;--cy-d:#5cc3e8;--cy-l:rgba(111,208,242,.15);
      --pk:#ff9fc6;--pk-d:#ff77ab;--vi:#b39aec;
      --ink:#dbe9f3;--ink2:#8aa3b8;--line:rgba(120,205,240,.20);
      --grad:linear-gradient(135deg,#5cc3e8 0%,#f48fbe 100%);
      --shadow:0 10px 26px rgba(0,0,0,.45);
    }
    body{background:linear-gradient(160deg,#0b1420 0%,#0d1a2a 45%,#151228 100%);font-family:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;color:var(--ink);overflow:hidden;height:100vh}

    /* ===== 顶部杂志栏 ===== */
    #h{position:fixed;top:0;left:0;right:0;z-index:1000;min-height:56px;background:rgba(10,18,30,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);box-shadow:0 6px 22px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 16px;gap:8px}
    #h .logo{display:flex;align-items:center;gap:11px}
    #h .logo-icon{width:36px;height:36px;background:var(--grad);border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 6px 16px rgba(140,200,230,.5)}
    #h .title-text{font-family:'ZCOOL KuaiLe','Noto Sans SC',sans-serif;font-size:21px;color:var(--cy-d);letter-spacing:2px;line-height:1.15}
    #h .subtitle{font-family:'Baloo 2',sans-serif;font-size:9px;color:var(--ink2);letter-spacing:3.5px;margin-top:1px}
    #h .tabs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;flex:1 1 auto;min-width:0}
    .tab{padding:7px 16px;border-radius:999px;border:1.5px solid var(--line);background:rgba(20,32,50,.9);color:#9fb6c6;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit;white-space:nowrap;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.3)}
    .tab:hover{border-color:var(--cy);color:var(--cy-d);transform:translateY(-1px)}
    .tab.on{background:var(--grad);color:#0b1420;border-color:transparent;box-shadow:0 8px 20px rgba(92,195,232,.35)}
    #h .stats{display:flex;gap:6px}
    .stat{text-align:center;padding:4px 12px;background:rgba(20,32,50,.9);border:1.5px solid var(--line);border-radius:16px;min-width:54px}
    .stat-v{font-family:'Baloo 2',sans-serif;font-size:17px;font-weight:800;color:var(--cy-d);line-height:1.1}
    .stat-l{font-size:8px;color:var(--ink2);letter-spacing:1px}

    /* ===== 地图 ===== */
    #map{position:fixed;top:56px;left:0;right:0;bottom:0;background:#0b1420;transition:top .15s}
    .leaflet-container{background:#0b1420!important;font-family:inherit}
    .leaflet-control-zoom{border:none!important;box-shadow:var(--shadow)!important;border-radius:14px!important;overflow:hidden}
    .leaflet-control-zoom a{background:rgba(20,32,50,.95)!important;border:none!important;border-bottom:1px solid var(--line)!important;color:var(--cy)!important;font-family:'Baloo 2',sans-serif!important;font-weight:800!important;width:34px!important;height:34px!important;line-height:34px!important}
    .leaflet-control-zoom a:hover{background:var(--cy-l)!important;color:var(--pk-d)!important}
    .mk{background:#fff;border-radius:38%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s ease;box-shadow:0 6px 16px rgba(110,170,200,.4)}
    .mk:hover{transform:scale(1.14) rotate(-3deg)}
    .mk-lb{white-space:nowrap;font-family:inherit;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.94);box-shadow:0 4px 12px rgba(110,170,200,.3);pointer-events:none}

    /* ===== 图例 ===== */
    #lg{position:fixed;bottom:14px;left:14px;z-index:900;background:rgba(13,22,36,.93);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1.5px solid rgba(120,205,240,.22);border-radius:22px;padding:12px 16px;max-height:52vh;overflow-y:auto;box-shadow:var(--shadow)}
    .lg-t{font-family:'ZCOOL KuaiLe','Noto Sans SC',sans-serif;font-size:12px;letter-spacing:3px;color:var(--cy);margin-bottom:8px}
    .lg-i{display:flex;align-items:center;gap:7px;font-size:11px;color:#9fb6c6;margin-bottom:4px;font-weight:500}
    .lg-d{width:9px;height:9px;border-radius:4px;flex-shrink:0;box-shadow:0 0 0 2px rgba(0,0,0,.55)}

    /* ===== 罗盘 ===== */
    #compass{position:fixed;right:18px;bottom:18px;z-index:900;width:98px;height:98px;border-radius:50%;background:rgba(255,255,255,.94);border:2px solid #e9f5fc;box-shadow:var(--shadow);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
    #compass::before{content:'';position:absolute;inset:15px;border-radius:50%;border:1.5px dashed #d9eefb}
    #compass div{position:absolute;font-family:'ZCOOL KuaiLe','Noto Sans SC',sans-serif;font-weight:700;color:var(--cy-d);line-height:1}
    #compass .cp-n{top:7px;left:50%;transform:translateX(-50%)}
    #compass .cp-s{bottom:7px;left:50%;transform:translateX(-50%);color:var(--pk-d)}
    #compass .cp-w{left:9px;top:50%;transform:translateY(-50%)}
    #compass .cp-e{right:9px;top:50%;transform:translateY(-50%);color:var(--pk-d)}
    #compass .cp-c{left:50%;top:50%;transform:translate(-50%,-50%);font-size:26px}

    /* ===== 杂志弹窗 ===== */
    #locModal{position:fixed;inset:0;z-index:5000;display:none;align-items:center;justify-content:center}
    #locModal.show{display:flex;animation:lmFade .25s ease}
    @keyframes lmFade{from{opacity:0}to{opacity:1}}
    #locModal .lm-overlay{position:absolute;inset:0;background:rgba(5,10,18,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer}
    #locModal .lm-box{position:relative;width:92%;max-width:420px;max-height:86vh;overflow-y:auto;background:#111d2f;border:1.5px solid rgba(120,205,240,.28);border-radius:24px;box-shadow:0 28px 70px rgba(0,0,0,.75);animation:lmUp .3s cubic-bezier(.34,1.3,.5,1)}
    @keyframes lmUp{from{transform:translateY(38px) scale(.94);opacity:0}to{transform:none;opacity:1}}
    #locModal .lm-close{position:absolute;top:10px;right:12px;width:32px;height:32px;border-radius:50%;background:rgba(11,20,32,.75);border:1.5px solid rgba(120,205,240,.28);color:#6fd0f2;font-size:19px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:20;transition:all .2s;font-family:serif}
    #locModal .lm-close:hover{background:#ff77ab;color:#0b1420;border-color:#ff77ab;transform:rotate(90deg)}
    #locModal .lm-box::-webkit-scrollbar{width:6px}
    #locModal .lm-box::-webkit-scrollbar-thumb{background:rgba(111,208,242,.3);border-radius:3px}
    .lp-img{width:100%;height:auto;aspect-ratio:1/1;object-fit:contain;display:block;background:#0d1727;border-bottom:1px solid rgba(120,205,240,.16)}
    .pz-hero{position:relative;padding:24px 24px 20px;border-radius:26px 26px 0 0;overflow:hidden}
    .pz-hero::after{content:'';position:absolute;right:-30px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.5)}
    .pz-profile{font-family:'Baloo 2',sans-serif;font-size:11px;letter-spacing:5px;color:var(--cy-d);opacity:.65;margin-bottom:6px;position:relative;z-index:2}
    .pz-emoji{position:absolute;right:22px;top:22px;font-size:52px;line-height:1;filter:drop-shadow(0 8px 14px rgba(120,180,210,.35));z-index:2}
    .pz-cat{display:inline-block;font-size:11px;font-weight:700;color:#fff;padding:3px 13px;border-radius:999px;margin-bottom:9px;letter-spacing:.5px;position:relative;z-index:2;box-shadow:0 5px 12px rgba(120,180,210,.3)}
    .pz-name{font-family:'ZCOOL KuaiLe','Noto Sans SC',sans-serif;font-size:27px;color:#37546a;letter-spacing:1px;line-height:1.25;position:relative;z-index:2}
    .pz-body{padding:16px 22px 22px;display:flex;flex-direction:column;gap:13px}
    .pz-row{display:flex;gap:9px;font-size:14px;line-height:1.78;color:#55707f;align-items:flex-start}
    .pz-k{flex-shrink:0;font-weight:700;color:var(--cy-d);font-size:13px;min-width:62px;padding-top:1px}
    .pz-row p{margin:0}
    .pz-ev{background:#fff6fb;border:1.6px dashed #f8cbdf;border-radius:18px;padding:13px 15px;font-size:13.5px;line-height:1.78;color:#8f6a80;display:flex;gap:9px;align-items:flex-start}
    .pz-ev .pz-k{color:var(--pk-d)}
    .pz-ev p{margin:0}
    .pz-tags{display:flex;flex-wrap:wrap;gap:7px}
    .pz-tags span{font-size:12px;padding:4px 11px;border-radius:999px;background:#f2f9fe;border:1.4px solid #dceffb;color:var(--cy-d);font-weight:600}
    .pz-btn{width:100%;margin-top:4px;padding:14px;border:none;border-radius:999px;background:var(--grad);color:#fff;font-size:16px;font-weight:800;letter-spacing:2px;cursor:pointer;font-family:inherit;box-shadow:0 12px 26px rgba(140,200,230,.5);transition:transform .15s}
    .pz-btn:hover{transform:translateY(-2px)}

    @media screen and (max-width:820px){
      #h{padding:7px 10px;gap:6px}
      #h .logo-icon{width:30px;height:30px;font-size:16px;border-radius:11px}
      #h .title-text{font-size:17px}
      #h .subtitle{display:none}
      .tab{padding:5px 12px;font-size:12px}
      .stat{padding:3px 9px;min-width:46px}
      .stat-v{font-size:14px}
      #lg{max-height:40vh;padding:9px 12px}
    }
    @media screen and (max-width:520px){
      #h .stats{display:none}
      #lg{display:none}
      #compass{display:none}
      .pz-name{font-size:23px}
      .pz-emoji{font-size:42px}
    }

    /* ===== 发光标记 ===== */
    .mk2{display:flex;align-items:center;justify-content:center;border-radius:50%;background:#0f1b2c;border:2px solid var(--c);cursor:pointer;animation:mkGlow 2.8s ease-in-out infinite;transition:transform .15s}
    .mk2:hover{transform:scale(1.15)}
    @keyframes mkGlow{0%,100%{box-shadow:0 0 0 2px rgba(0,0,0,.45),0 0 9px var(--c)}50%{box-shadow:0 0 0 6px rgba(0,0,0,.25),0 0 18px var(--c)}}
    .mk2-lb{white-space:nowrap;font-size:10px;font-weight:700;letter-spacing:.3px;pointer-events:none;text-shadow:0 0 5px #0b1420,0 0 10px #0b1420,0 1px 3px rgba(0,0,0,.95)}

    /* ===== 星点/气泡背景 ===== */
    #fx{position:fixed;inset:0;z-index:500;pointer-events:none}

    /* ===== Popup（青粉） ===== */
    .leaflet-popup-content-wrapper{background:#111d2f!important;border-radius:22px!important;border:1.5px solid rgba(120,205,240,.26)!important;box-shadow:0 20px 44px rgba(0,0,0,.62)!important;padding:0!important;overflow:hidden}
    .leaflet-popup-content{margin:0!important;color:#dbe9f3;font-family:inherit!important;line-height:1.6}
    .leaflet-popup-content-wrapper,.leaflet-popup-content{min-width:250px}
    .lp-h,.lp-b{width:100%}
    .leaflet-popup-tip{background:#111d2f!important;border:1.5px solid rgba(120,205,240,.26)!important}
    .leaflet-popup-close-button{color:var(--cy-d)!important;font-size:20px!important;top:10px!important;right:12px!important;z-index:20}
    .lp-h{position:relative;padding:18px 20px 14px;border-bottom:1px solid rgba(120,205,240,.16)}
    .lp-emoji{position:absolute;right:16px;top:16px;font-size:36px;line-height:1}
    .lp-badge{display:inline-block;font-size:10px;font-weight:700;color:#0b1420;padding:3px 11px;border-radius:999px;margin-bottom:8px}
    .lp-name{font-family:'ZCOOL KuaiLe','Noto Sans SC',sans-serif;font-size:21px;color:#e6f3fb;letter-spacing:1px;padding-right:40px}
    .lp-b{padding:13px 20px 17px;display:flex;flex-direction:column;gap:9px}
    .lp-r{display:flex;gap:8px;font-size:12.5px;color:#a9bfcd;align-items:flex-start}
    .lp-k{flex-shrink:0;font-weight:700;color:var(--cy);font-size:11.5px;min-width:52px}
    .lp-r .v{flex:1}
    .lp-btn{width:100%;margin-top:3px;padding:11px;border:none;border-radius:999px;background:var(--grad);color:#0b1420;font-size:13.5px;font-weight:800;letter-spacing:1.5px;cursor:pointer;font-family:inherit;box-shadow:0 8px 18px rgba(0,0,0,.45)}
    .lp-btn:hover{filter:brightness(1.04)}
  </style>
</head>

<body>
  <div id="h">
    <div class="logo">
      <div class="logo-icon" id="logo-icon">🎀</div>
      <div>
        <div class="title-text" id="title-text">足控天堂 Ⅱ · 全城总图</div>
        <div class="subtitle" id="subtitle">FOOT PARADISE Ⅱ · SUPER MAP</div>
      </div>
    </div>
    <div class="tabs" id="tabs">
      <div class="tab on" data-w="city" onclick="sw('city')">城区地点</div>
      <div class="tab" data-w="gs" onclick="sw('gs')">公司内部</div>
    </div>
    <div class="stats" id="stats">
      <div class="stat"><div class="stat-v" id="stat1">0</div><div class="stat-l" id="stat1l">地点</div></div>
      <div class="stat"><div class="stat-v" id="stat2">0</div><div class="stat-l" id="stat2l">分区</div></div>
      <div class="stat"><div class="stat-v" id="stat3">0</div><div class="stat-l" id="stat3l">章节</div></div>
    </div>
  </div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="map"></div>
  <div id="lg"></div>
  <div id="locModal">
    <div class="lm-overlay" onclick="closeLocModal()"></div>
    <div class="lm-box">
      <div class="lm-close" onclick="closeLocModal()">×</div>
      <div id="locModalContent"></div>
    </div>
  </div>

  <script>
    /* ---------- 前往（发送到酒馆输入框） ---------- */
    function g(l) {
      const m = '前往' + l;
      try {
        const t = document.querySelector('#send_textarea');
        if (t) { t.value = m; const s = document.querySelector('#send_but'); if (s) s.click(); }
      } catch (e) { console.log(m); }
    }

    /* ---------- Popup 内容（青粉杂志风） ---------- */
    /* ---------- 居中弹窗内容（含地点插图，深色） ---------- */
    var IMG_BASE = 'https://zyxjack123.top/足控天堂/插图/地图/';
    function locModalContent(l) {
      var img = IMG_BASE + encodeURI(l.n) + '1.webp';
      return '<img class="lp-img" src="' + img + '" alt="' + l.n + '" loading="lazy" onerror="this.style.display=\'none\'"/>' +
        '<div class="lp-h" style="background:linear-gradient(135deg,' + l.c + '38 0%,rgba(17,29,47,0) 78%),#111d2f">' +
          '<div class="lp-emoji">' + l.i + '</div>' +
          '<div class="lp-badge" style="background:' + l.c + ';color:#0b1420">' + l.l + '</div>' +
          '<div class="lp-name">' + l.n + '</div>' +
        '</div>' +
        '<div class="lp-b">' +
          '<div class="lp-r"><span class="lp-k">📍 位置</span><span class="v">' + (l.p || '') + '</span></div>' +
          '<div class="lp-r"><span class="lp-k">🎯 功能</span><span class="v">' + (l.fn || '') + '</span></div>' +
          '<div class="lp-r"><span class="lp-k">👁 外观</span><span class="v">' + (l.a || '') + '</span></div>' +
          '<button class="lp-btn" onclick="g(\'' + l.n + '\')">前往 ' + l.n + '</button>' +
        '</div>';
    }
    function showLocModal(l) {
      var box = document.getElementById('locModalContent');
      if (box) box.innerHTML = locModalContent(l);
      var el = document.getElementById('locModal');
      if (el) el.classList.add('show');
    }
    function closeLocModal() {
      var el = document.getElementById('locModal');
      if (el) el.classList.remove('show');
    }
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeLocModal(); });

    /* ---------- 地图底层 ---------- */
    let M, LY = [], MK = [], LN = [], PP = [];
    function initMap() {
      M = L.map('map', { crs: L.CRS.Simple, minZoom: -2, maxZoom: 2.5, zoomControl: true, attributionControl: false, center: [800, 1100], zoom: 0, maxBoundsViscosity: 1 });
    }
    function clearMap() {
      LY.forEach(l => M.removeLayer(l)); MK.forEach(m => M.removeLayer(m));
      LN.forEach(n => M.removeLayer(n)); PP.forEach(p => M.removeLayer(p));
      LY = []; MK = []; LN = []; PP = [];
    }
    function addBg(u, W, H) {
      const B = [[0, 0], [H, W]];
      M.setMaxBounds(B);
      const bg = L.imageOverlay(u, B, { opacity: 1, zIndex: 1, interactive: false }).addTo(M);
      LY.push(bg);
      M.fitBounds(B, { paddingTopLeft: [10, 8], paddingBottomRight: [10, 8] });
      return B;
    }

    /* ---------- 地形绘制：城区（虚拟坐标系 2000×1480） ---------- */
    function cityTerrain(W, H) {
      /* 有机地块：Catmull-Rom 平滑闭合曲线，彻底去掉方正感 */
      function blob(cx, cy, rx, ry, wob, seed) {
        const n = seed.length, pts = [];
        for (let i = 0; i < n; i++) {
          const a = Math.PI * 2 * i / n - Math.PI / 2;
          const k = 1 + wob * seed[i];
          pts.push([cx + Math.cos(a) * rx * k, cy + Math.sin(a) * ry * k]);
        }
        let d = 'M' + pts[0][0].toFixed(0) + ',' + pts[0][1].toFixed(0);
        for (let i = 0; i < n; i++) {
          const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
          d += ' C' + (p1[0] + (p2[0] - p0[0]) / 6).toFixed(0) + ',' + (p1[1] + (p2[1] - p0[1]) / 6).toFixed(0) +
            ' ' + (p2[0] - (p3[0] - p1[0]) / 6).toFixed(0) + ',' + (p2[1] - (p3[1] - p1[1]) / 6).toFixed(0) +
            ' ' + p2[0].toFixed(0) + ',' + p2[1].toFixed(0);
        }
        return d + ' Z';
      }
      const SEEDS = [
        [.9, -.7, 1.1, -.5, .8, -1, .6, -.9, 1, -.4, .7, -1.1],
        [-.8, 1, -.6, .9, -1.1, .5, -.7, 1.1, -.9, .6, -1, .8],
        [1, -.9, .6, -1.1, .8, -.5, 1.2, -.8, .7, -1, .9, -.6],
        [-1, .7, -1.2, .9, -.6, 1.1, -.8, .5, -1, .8, -1.1, .6],
        [.7, -1.1, 1, -.6, .9, -1.2, .5, 1.1, -.7, .8, -1, 1.2]
      ];
      const DIST = [
        { cx: 390, cy: 265, rx: 330, ry: 175, wob: .15, c: '#57a6cb', t: '西市口商圈', e: 'WEST MARKET', lx: 150, ly: 402 },
        { cx: 1440, cy: 262, rx: 340, ry: 172, wob: .16, c: '#4e9fc4', t: '老城民生区', e: 'OLDTOWN', lx: 1212, ly: 398 },
        { cx: 820, cy: 640, rx: 580, ry: 118, wob: .14, c: '#6aa9c9', t: '滨江地带', e: 'RIVERSIDE', lx: 350, ly: 702 },
        { cx: 1680, cy: 640, rx: 250, ry: 118, wob: .17, c: '#5fa9cf', t: '东区娱乐带', e: 'EAST ENT.', lx: 1548, ly: 722 },
        { cx: 1010, cy: 1265, rx: 900, ry: 270, wob: .17, c: '#57a6cb', t: '专属场景 · 十二章节', e: 'SCENE GROUP · CH.1-12', lx: 300, ly: 1340 }
      ];
      const land = DIST.map(function (d, i) {
        return '<path d="' + blob(d.cx, d.cy, d.rx, d.ry, d.wob, SEEDS[i]) + '" fill="#16263d" fill-opacity=".92" stroke="#6fd0f2" stroke-opacity=".3" stroke-width="2.5" stroke-dasharray="12 9" stroke-linejoin="round"/>' +
          '<text x="' + d.lx + '" y="' + d.ly + '" font-family="sans-serif" font-weight="bold" font-size="20" fill="#9fdcf7" opacity=".6" letter-spacing="3">' + d.t + '</text>' +
          '<text x="' + (d.lx + 1) + '" y="' + (d.ly + 18) + '" font-family="sans-serif" font-size="10" fill="#9fdcf7" opacity=".32" letter-spacing="3">' + d.e + '</text>';
      }).join('');

      /* 湖泊 */
      const lakes = [
        { cx: 420, cy: 1120, rx: 175, ry: 90, wob: .16, s: SEEDS[2] },
        { cx: 820, cy: 1330, rx: 195, ry: 105, wob: .15, s: SEEDS[1] },
        { cx: 600, cy: 180, rx: 110, ry: 60, wob: .17, s: SEEDS[3] },

        baojian: { ll: [680, 1260], n: '保健室', l: '生活 · 保健', c: '#5fcfb8', i: '🩺', p: '公司本部·魔界保健室改造', fn: '巧可魅魔体检室、健康管理、脚感评分', a: '医疗床、听诊器、体温计墙，墙角摆着绿萝，消毒水味里混着一丝甜腻的魔界气息；门上贴着体检请预约、脚部检查优先、本医生是专业的。门口摆着一台老式量脚器，刻度表被磨得发亮，排队的大叔一个个自觉脱鞋等着量。', e: '巧可给全员体检时顺带检查脚部，评到高分眼睛发亮：这双脚，是上等的足控收藏品。有人想赖账不脱袜子，她握着听诊器敲桌：体检是正经事，把袜子脱了。听诊器按到主角胸口时她总走神，一本正经：心跳太快需要复查——复查三次了还没查出结果。', t: '保健室, 体检, 脚感评分, 量脚器, 健康管理' },

        bengchuang: { ll: [870, 1120], n: '蹦床房', l: '内容 · 蹦床', c: '#f2a0c8', i: '🐰', p: '公司本部·兔兔蹦床专区', fn: '佩克拉蹦床直播、PK舞台、弹力竞猜', a: '一张小蹦床，护网缠着彩灯，四角堆着兔耳朵发箍和奖杯；弹跳声咯吱咯吱，地板被踩得发亮。护网上挂着竞猜板：猜中今晚袜口卷多高，奖兔兔签名袜——附赠闻一口机会。', e: '蹦床直播时裙摆飞扬，黑裤袜绷出弧线，护网外男粉押注押红了眼：再高一点。佩克拉落地时差点踩到边缘，脚趾在袜子里蜷了蜷，叉腰瞪镜头：刚才那是Peko故意秀的弹力，才不是失误——弹幕压根不信。有男粉押中袜口卷到脚踝，她瞪大眼睛时，袜口已经卷到脚踝上方。', t: '蹦床房, 蹦床, 弹力竞猜, PK舞台, 兔耳发箍' },

      D: {
        laojie: { ll: [190, 250], n: '西市口老街', l: '街区 · 日常', c: '#7cc7e8', i: '🏮', p: '临江市西市口·老街便利店台阶', fn: '露西娅神侍乞讨角、塌房主播集散地、男粉朝圣地', a: '凌晨的街灯惨白，便利店灯光亮着，台阶边堆着纸箱和乞讨牌；空气里是关东煮和旧纸箱的味道，混着一点捂了一天的袜气。电线杆下常年蹲着几个大叔，人手一个小马扎，说是晨练，其实在等乞讨少女起床脱袜换新。', e: '又有人跪在台阶上举着求收留的纸牌，白丝磨破袜尖露出一点脚趾，蹲点的大叔集体倒吸一口气，有人已经开始往纸箱里塞钱。路人往纸箱里丢硬币，也有人蹲下嗅她脚边的气味，同伴不但不拉反而跟着蹲下，被便利店店员举着拖把赶开。', t: '西市口老街, 老街便利店, 乞讨角, 塌房主播, 朝圣' },
        luosen: { ll: [190, 620], n: '罗森便利店', l: '街区 · 日常', c: '#7cc76a', i: '🏪', p: '临江市西市口·24小时便利店', fn: '古拉薯片窝、塔菲贩卖机发明、原味袜暗号交易点', a: '货架灯光白亮，薯片区被古拉占领，贩卖机前贴满塔菲的实验便签；收银台边摆着一只玻璃罐，罐里塞满纸团——那是有缘人留下的袜子暗号。夜班店员是个见多识广的大叔，对深夜来买袜子的客人见怪不怪，还会贴心问一句：冷藏的要不要。', e: '古拉深夜进货薯片，光脚踩在冰柜边上被店员提醒，她满嘴鲨鲨才不是故意的，大叔却盯着她那双光脚看了两秒，默默递来一双拖鞋。塔菲蹲在贩卖机前研究袜子贩卖机，路人差点报警，几个大叔围上来问这机器能不能出穿过的，气得她抄起文件夹赶人。', t: '罗森便利店, 贩卖机, 吞币, 薯片区, 袜字暗号' },

        shequ: { ll: [420, 250], n: '社区医院', l: '街区 · 医疗', c: '#5fcfb8', i: '🏥', p: '临江市老城区社区医院', fn: '巧可出诊点、健康体检、脚气门诊流量王', a: '白墙消毒水味，输液室电视机放着养生节目；走廊尽头诊室门上贴着脚部专科手写牌，候诊椅上坐满戴工牌的大叔，人手一双脱下来的鞋，眼巴巴盯着诊室门。门框上挂着锦旗：妙手回春，脚感一流——全体脚奴敬赠，被巧可反扣着说太羞耻。', e: '巧可给女主播做脚部体检，顺便推销原味袜健康指南，被护士长白眼：你是医生不是带货的。有男社畜拿脚气当借口来体检，被巧可一眼看穿你是来看脚的还是来闻袜子的，他当场认罚三盒脚膜，交完钱又小声问脚膜能指定姑娘用过的吗，被病历本拍出去。', t: '社区医院, 脚部专科, 脚气门诊, 体检, 候诊' },
        mojie: { ll: [420, 620], n: '魔界保健室', l: '街区 · 医疗', c: '#b39aec', i: '🩹', p: '魔界·保健室走廊尽头（巧可迷路地）', fn: '巧可的魔界大本营、体检验脚、跨域门诊', a: '门牌写着魔界文字，消毒水味里混着甜腻气息，墙上挂着本医生什么都查的锦旗，角落还绣着脚感优先四个小字；走廊上放着一台老式量脚器，刻度表磨得发亮，两侧木地板被魔界脚奴们跪出两道浅浅的膝痕。', e: '巧可抱GPS在人间迷路，边跑边骂：魔界的路我闭着眼都能走，你们人间的门怎么都长得一样。等她冲回保健室，门口已经跪着三个排队验脚的大叔，她抄起听诊器敲桌：排队，本医生先去洗个手。有人门口留白袜附字条找本医生验脚出价面议，她气得跺脚，跺完又偷偷把袜子收进抽屉。', t: '魔界保健室, 魔界文字, 跨域门诊, 量脚器, 魔界大本营' },
