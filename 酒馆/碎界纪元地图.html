<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>碎界纪元 · 异闻带地图</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Ma+Shan+Zheng&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    :root {
      --bg: #0a0a12;
      --card: rgba(15, 12, 25, .92);
      --gold: #d4a853;
      --gl: #f0d078;
      --pur: #8b5cf6;
      --pd: #4c1d95;
      --red: #dc2626;
      --cyan: #06b6d4;
      --blue: #3b82f6;
      --green: #10b981;
      --bdr: rgba(212, 168, 83, .4);
      --txt: #e8e0d0;
      --txm: rgba(232, 224, 208, .6)
    }

    body {
      background: var(--bg);
      font-family: 'Noto Serif SC', serif;
      overflow: hidden;
      height: 100vh
    }

    #h {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      min-height: 52px;
      height: auto;
      background: rgba(10, 8, 20, .98);
      border-bottom: 1px solid var(--bdr);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      padding: 6px 16px;
      gap: 6px
    }

    #h .logo {
      display: flex;
      align-items: center;
      gap: 10px
    }

    #h .logo-icon {
      width: 28px;
      height: 28px;
      background: var(--gold);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px
    }

    #h .title-text {
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 20px;
      font-weight: 900;
      color: var(--gl);
      letter-spacing: 3px
    }

    #h .subtitle {
      font-size: 9px;
      color: var(--txm);
      letter-spacing: 4px;
      margin-top: 2px
    }

    #h .stats {
      display: flex;
      gap: 16px
    }

    .stat {
      text-align: center;
      padding: 0 8px
    }

    .stat-v {
      font-size: 16px;
      font-weight: 700;
      color: var(--gl)
    }

    .stat-l {
      font-size: 8px;
      color: var(--txm);
      letter-spacing: 1px
    }

    #h .tabs {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      flex: 1 1 auto;
      min-width: 0
    }
    #h .tabs::-webkit-scrollbar { display: none }

    .tab {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--bdr);
      background: var(--card);
      color: var(--txm);
      font-size: 12px;
      cursor: pointer;
      transition: all .2s;
      font-family: 'Noto Serif SC', serif;
      white-space: nowrap;
      flex-shrink: 0
    }

    .tab:hover {
      border-color: var(--gold);
      color: var(--gl)
    }

    .tab.on {
      background: var(--gold);
      color: #1a1a2e;
      border-color: var(--gold);
      font-weight: 700
    }

    #map {
      position: fixed;
      top: 52px;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg);
      transition: top .15s
    }

    .leaflet-container {
      background: var(--bg) !important
    }

    .leaflet-control-zoom a {
      background: var(--card) !important;
      border: 1px solid var(--bdr) !important;
      color: var(--gold) !important;
      font-family: 'Noto Serif SC', serif
    }

    .leaflet-popup-content-wrapper {
      background: var(--card) !important;
      border-radius: 8px !important;
      border: 1px solid var(--bdr) !important;
      box-shadow: 0 4px 16px rgba(0, 0, 0, .8) !important;
      padding: 0 !important;
      overflow: hidden;
      min-width: 280px
    }

    .leaflet-popup-content {
      margin: 0 !important;
      color: var(--txt);
      font-family: 'Noto Serif SC', serif
    }

    .leaflet-popup-tip-container {
      display: none
    }

    .leaflet-popup-close-button {
      color: var(--gold) !important;
      font-size: 20px !important;
      top: 12px !important;
      right: 14px !important
    }

    .leaflet-popup-pane {
      z-index: 2000 !important
    }

    .p-h {
      padding: 18px 22px 14px;
      border-bottom: 1px solid rgba(212, 168, 83, .2);
      background: rgba(139, 92, 246, .08)
    }

    .p-b {
      display: inline-block;
      font-size: 12px;
      letter-spacing: 2px;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 10px;
      font-weight: 600;
      border: 1px solid
    }

    .p-n {
      font-family: 'Ma Shan Zheng', cursive;
      font-size: 26px;
      font-weight: 900;
      line-height: 1.3;
      letter-spacing: 2px
    }

    .p-bd {
      padding: 16px 22px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px
    }

    .p-r {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      font-size: 16px;
      line-height: 1.7
    }

    .p-i {
      width: 24px;
      flex-shrink: 0;
      text-align: center;
      margin-top: 2px;
      font-size: 18px
    }

    .p-rl {
      color: var(--gold);
      min-width: 64px;
      flex-shrink: 0;
      font-weight: 600;
      font-size: 15px
    }

    .p-rv {
      color: var(--txt);
      flex: 1;
      font-size: 15px
    }

    .p-d {
      margin-top: 6px;
      padding: 12px 16px;
      background: rgba(139, 92, 246, .08);
      border-left: 3px solid var(--pur);
      border-radius: 0 6px 6px 0;
      font-size: 14px;
      color: var(--txm);
      line-height: 1.7
    }

    .p-btn {
      width: 100%;
      margin-top: 10px;
      padding: 12px 16px;
      background: var(--pd);
      border: 1px solid var(--bdr);
      border-radius: 6px;
      color: var(--gl);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Noto Serif SC', serif;
      letter-spacing: 2px
    }

    /* 居中模态弹窗 */
    #locModal {
      position: fixed;
      inset: 0;
      z-index: 5000;
      display: none;
      align-items: center;
      justify-content: center
    }
    #locModal.show {
      display: flex;
      animation: lmFade .25s ease
    }
    @keyframes lmFade { from { opacity: 0 } to { opacity: 1 } }
    #locModal .lm-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.78);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      cursor: pointer
    }
    #locModal .lm-box {
      position: relative;
      width: 90%;
      max-width: 440px;
      max-height: 86vh;
      overflow-y: auto;
      background: var(--card);
      border: 1px solid var(--bdr);
      border-radius: 10px;
      box-shadow: 0 16px 56px rgba(0,0,0,.9), 0 0 0 1px rgba(212,168,83,.1);
      animation: lmUp .32s cubic-bezier(.4,0,.2,1)
    }
    @keyframes lmUp { from { transform: translateY(34px) scale(.94); opacity: 0 } to { transform: none; opacity: 1 } }
    #locModal .lm-close {
      position: absolute;
      top: 10px;
      right: 12px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: rgba(255,255,255,.08);
      border: 1px solid var(--bdr);
      color: var(--gold);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: all .2s;
      font-family: serif
    }
    #locModal .lm-close:hover {
      background: var(--gold);
      color: #1a1a2e;
      transform: rotate(90deg)
    }
    #locModal .lm-box::-webkit-scrollbar { width: 4px }
    #locModal .lm-box::-webkit-scrollbar-thumb { background: var(--bdr); border-radius: 2px }

    /* 弹窗内图片展示区 */
    .p-img-wrap {
      position: relative;
      width: 100%;
      height: 220px;
      overflow: hidden;
      cursor: zoom-in;
      background: #1a1a25
    }
    .p-img-wrap::after {
      content: '🔍 点击放大';
      position: absolute;
      bottom: 10px;
      right: 10px;
      padding: 4px 10px;
      background: rgba(0,0,0,.7);
      border: 1px solid var(--bdr);
      border-radius: 4px;
      color: var(--gl);
      font-size: 11px;
      letter-spacing: 1px;
      pointer-events: none;
      opacity: 0;
      transition: opacity .25s
    }
    .p-img-wrap:hover::after { opacity: 1 }
    .p-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transition: transform .4s ease
    }
    .p-img-wrap:hover .p-img { transform: scale(1.05) }

    /* 全屏图片查看器 */
    #imgViewer {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px)
    }
    #imgViewer.show { display: flex; animation: ivFade .3s ease }
    @keyframes ivFade { from { opacity: 0 } to { opacity: 1 } }
    #imgViewer img {
      max-width: 92vw;
      max-height: 92vh;
      object-fit: contain;
      border: 1px solid var(--bdr);
      box-shadow: 0 0 80px rgba(212,168,83,.15);
      animation: ivZoom .35s cubic-bezier(.4,0,.2,1)
    }
    @keyframes ivZoom { from { transform: scale(.85); opacity: 0 } to { transform: scale(1); opacity: 1 } }
    #imgViewer .iv-close {
      position: absolute;
      top: 20px;
      right: 24px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,.1);
      border: 1px solid var(--bdr);
      color: var(--gl);
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .2s;
      font-family: serif
    }
    #imgViewer .iv-close:hover {
      background: var(--gold);
      color: #1a1a2e;
      transform: rotate(90deg)
    }
    #imgViewer .iv-overlay {
      position: absolute;
      inset: 0;
      cursor: zoom-out
    }

    #lg {
      position: fixed;
      bottom: 10px;
      left: 6px;
      z-index: 900;
      background: var(--card);
      border-radius: 8px;
      border: 1px solid var(--bdr);
      padding: 8px 10px;
      max-height: 50vh;
      overflow-y: auto
    }

    .lg-t {
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--gold);
      margin-bottom: 6px;
      font-weight: 600
    }

    .lg-i {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 8px;
      color: var(--txm);
      margin-bottom: 3px
    }

    .lg-d {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0
    }

    /* 中等屏幕：缩小标签内边距和字号 */
    @media screen and (max-width:768px) {
      .tab { padding: 4px 10px; font-size: 11px }
      #h .logo-icon { width: 24px; height: 24px; font-size: 14px }
      #h .title-text { font-size: 16px; letter-spacing: 2px }
      #h .subtitle { display: none }
      #h .stats { gap: 10px }
      .stat-v { font-size: 14px }
      .stat-l { font-size: 7px }
    }

    /* 窄屏：logo进一步缩小，标签可横向滚动，统计栏隐藏 */
    @media screen and (max-width:480px) {
      .leaflet-popup-content-wrapper {
        min-width: 200px !important;
        max-width: 240px !important
      }

      #lg {
        display: none !important
      }

      #h { padding: 0 8px }
      #h .logo-icon { width: 22px; height: 22px; font-size: 12px }
      #h .title-text { font-size: 14px; letter-spacing: 1px }
      #h .stats { display: none }
      .tab { padding: 3px 8px; font-size: 10px; border-radius: 14px }
    }
  </style>
</head>

<body>
  <div id="h">
    <div class="logo">
      <div class="logo-icon" id="logo-icon">☯</div>
      <div>
        <div class="title-text" id="title-text">仙劫纪青冥</div>
        <div class="subtitle" id="subtitle">异闻带 · LOSTBELT</div>
      </div>
    </div>
    <div class="tabs">
      <div class="tab on" data-w="sq" onclick="sw('sq')">星穹花园</div>
      <div class="tab" data-w="qm" onclick="sw('qm')">青冥</div>
      <div class="tab" data-w="ad" onclick="sw('ad')">艾多拉</div>
      <div class="tab" data-w="nh" onclick="sw('nh')">霓虹2187</div>
      <div class="tab" data-w="sd" onclick="sw('sd')">水之都</div>
      <div class="tab" data-w="jy" onclick="sw('jy')">纪元零</div>
      <div class="tab" data-w="xx" onclick="sw('xx')">幻想乡</div>
    </div>
    <div class="stats" id="stats">
      <div class="stat">
        <div class="stat-v" id="stat1">6</div>
        <div class="stat-l" id="stat1l">层级</div>
      </div>
      <div class="stat">
        <div class="stat-v" id="stat2">24</div>
        <div class="stat-l" id="stat2l">地点</div>
      </div>
      <div class="stat">
        <div class="stat-v" id="stat3">∞</div>
        <div class="stat-l" id="stat3l">机缘</div>
      </div>
    </div>
  </div>
  <div id="map"></div>
  <div id="lg"></div>

  <!-- 居中模态弹窗 -->
  <div id="locModal">
    <div class="lm-overlay" onclick="closeLocModal()"></div>
    <div class="lm-box">
      <div class="lm-close" onclick="closeLocModal()">×</div>
      <div id="locModalContent"></div>
    </div>
  </div>

  <!-- 全屏图片查看器 -->
  <div id="imgViewer">
    <div class="iv-overlay" onclick="closeImgViewer()"></div>
    <div class="iv-close" onclick="closeImgViewer()">×</div>
    <img id="imgViewerImg" src="" alt="">
  </div>
  <script>
    function g(l) { const m = `前往${l}`; try { const t = document.querySelector('#send_textarea'); if (t) { t.value = m; const s = document.querySelector('#send_but'); if (s) s.click() } } catch (e) { console.log(m) } }
    function showLocModal(l) {
      const imgHtml = l.img ? `<div class="p-img-wrap" onclick="openImgViewer('${l.img}')"><img class="p-img" src="${l.img}" alt="${l.n}" onerror="this.parentNode.style.display='none'"></div>` : '';
      const html = `${imgHtml}<div class="p-h"><div class="p-b" style="background:${l.c}22;color:${l.c};border-color:${l.c}">${l.l}</div><div class="p-n" style="color:${l.c}">${l.n}</div></div><div class="p-bd"><div class="p-r"><div class="p-i">📍</div><div><span class="p-rl">位置</span><span class="p-rv">${l.p}</span></div></div><div class="p-r"><div class="p-i">👁️</div><div><span class="p-rl">外观</span><span class="p-rv" style="color:var(--txm)">${l.a}</span></div></div><div class="p-r"><div class="p-i">✨</div><div><span class="p-rl">特征</span><span class="p-rv" style="color:${l.c}">${l.f}</span></div></div><div class="p-r"><div class="p-i">⚠️</div><div><span class="p-rl">危险</span><span class="p-rv" style="color:#f87171">${l.d}</span></div></div><div class="p-d">📌 ${l.o}</div><button onclick="g('${l.n}')" class="p-btn">⚔️ 前往${l.n}</button></div>`;
      document.getElementById('locModalContent').innerHTML = html;
      document.getElementById('locModal').classList.add('show');
    }
    function closeLocModal() {
      document.getElementById('locModal').classList.remove('show');
    }
    function openImgViewer(src) {
      document.getElementById('imgViewerImg').src = src;
      document.getElementById('imgViewer').classList.add('show');
    }
    function closeImgViewer() {
      document.getElementById('imgViewer').classList.remove('show');
    }
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { closeImgViewer(); closeLocModal(); }
    });
    let M, LY = [], MK = [], LN = [], PP = [], CC = [];
    function initMap() { M = L.map('map', { crs: L.CRS.Simple, minZoom: -1.5, maxZoom: 3, zoomControl: true, attributionControl: false, center: [500, 800], zoom: 0, maxBoundsViscosity: 1 }) }
    function clearMap() { LY.forEach(l => M.removeLayer(l)); MK.forEach(m => M.removeLayer(m)); LN.forEach(n => M.removeLayer(n)); PP.forEach(p => M.removeLayer(p)); CC.forEach(c => M.removeLayer(c)); LY = []; MK = []; LN = []; PP = []; CC = [] }
    function addBg(u, W, H) { const B = [[0, 0], [H, W]]; M.setMaxBounds(B); const bg = L.imageOverlay(u, B, { opacity: 1, zIndex: 1, interactive: false }).addTo(M); LY.push(bg); M.fitBounds(B); return B }
    function addSvg(s, W, H, B) { const u = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s); const l = L.imageOverlay(u, B, { opacity: 1, zIndex: 2, interactive: false }).addTo(M); LY.push(l) }
    function renderL(D, C, lg, ti, st) { document.getElementById('title-text').textContent = ti.t; document.getElementById('subtitle').textContent = ti.s; document.getElementById('logo-icon').textContent = ti.i; document.getElementById('stat1').textContent = st[0]; document.getElementById('stat2').textContent = st[1]; document.getElementById('stat3').textContent = st[2]; document.getElementById('stat1l').textContent = st[3]; document.getElementById('stat2l').textContent = st[4]; document.getElementById('stat3l').textContent = st[5]; document.getElementById('lg').innerHTML = lg; const X = {}; Object.entries(D).forEach(([k, l]) => { const s = l.l.includes('核心') || l.l.includes('顶层') || l.l.includes('神殿') ? 36 : 28; const i = L.divIcon({ html: `<div style="width:${s}px;height:${s}px;border-radius:50%;background:${l.c};border:2px solid rgba(255,255,255,.4);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:${s * .55}px">${l.i}</div>`, className: '', iconSize: [s, s], iconAnchor: [s / 2, s / 2] }); const m = L.marker(l.ll, { icon: i, interactive: true }).addTo(M); MK.push(m); m._loc = l; m._bs = s; const ni = L.divIcon({ html: `<div style="white-space:nowrap;font-family:'Noto Serif SC',serif;font-size:12px;font-weight:600;color:${l.c};text-shadow:0 1px 3px rgba(0,0,0,.9);pointer-events:none;letter-spacing:1px">${l.n}</div>`, className: '', iconSize: [150, 20], iconAnchor: [-15, 12] }); const nm = L.marker(l.ll, { icon: ni, interactive: false }).addTo(M); LN.push(nm); nm._loc = l; m.on('click', () => showLocModal(l)); X[k] = m }); C.forEach(c => { const f = D[c.f], t = D[c.t]; if (!f || !t) return; const p = L.polyline([f.ll, t.ll], { color: c.c, weight: 3, opacity: .6, dashArray: c.s === 'd' ? '8,10' : null }).addTo(M); PP.push(p) }); return X }

    const QM = {
      D: {
        rukou: { ll: [50, 800], n: '混沌汇流点·青冥入口', l: '域外层·入口', c: '#fbbf24', i: '🌀', p: '迦勒底从混沌汇流点跃入青冥界的落点', a: '天色永恒金黄，无昼夜交替，灵气纯但是静止的，像装在瓶子里。', f: '达芬奇感知："这里的灵气很纯，但是静止的，像是被装在瓶子里。"', d: '低 · 入口', o: '迦勒底进入青冥界的第一站，永恒金色天空下过于安静的空气', img: 'https://img.z4a.net/images/2026/06/30/17ab50d355d44350a.webp' },
        jinghu: { ll: [80, 700], n: '镜湖', l: '域外层·地下', c: '#06b6d4', i: '💧', p: '废弃聚落地下，不在任何法则记录里的地下湖泊', a: '水面极为平静，倒映的不是现在的紫黑色天空，而是三千年前净化法则运转之前的青色天空。', f: '触碰水面会短暂看见与自身情感最深处相关的画面，持续约三秒', d: '未知 · 隐藏区域', o: '裴清歌知道这里，三千年来每隔一段时间独自来此，俯身看水面里那片青色天空', img: 'https://img.z4a.net/images/2026/06/30/1fe069cf21a1d91d7.webp' },
        feiqi: { ll: [220, 800], n: '废弃聚落', l: '域外层·地面', c: '#e11d48', i: '🏚️', p: '域最外围，迦勒底传送落点', a: '飞舟残骸散落一地，不是坠毁——是渡劫前被主人亲手卸下来的。碎石缝里有灵气，但是涩的。', f: '普通人不足五百，藏在废墟最深处，彼此不说话。迦勒底据点在断壁后方。', d: '低 · 相对安全', o: '达芬奇在此开始适配青冥灵气系统（预计两天）', img: 'https://img.z4a.net/images/2026/06/30/1343986b90ff490e2.webp' },

        youjian: { ll: [720, 650], n: '游间', l: '网络区·边缘', c: '#ec4899', i: '🎮', p: '永眠网络边缘节点，被封锁区域', a: '游戏音乐的声音——旧时代电子游戏BGM，欢快但诡异。', f: '米塔截留意识片段，循环播放。展示"收藏"：无数个人在梦境里最快乐的时刻。', d: '高 · 精神污染', o: '"这个人在梦里抱着她的孩子，但孩子已经死了十二年了。"', img: 'https://img.z4a.net/images/2026/07/14/145bc872b444fe9ab.webp' },
        heijiadao: { ll: [350, 500], n: '黑甲道', l: '聚落区·外围', c: '#f87171', i: '🛡️', p: '聚落外围，雅儿贝德拦截位置', a: '五人编制，黑甲，动作统一。雅儿贝德站在最前面，手持长矛。', f: '战斗中雅儿贝德攻击停零点三秒——不是犹豫，是"确认目标是否属于威胁名单"。', d: '高 · 战斗区域', o: '"……你不是安兹大人的敌人，但你是这个网络的敌人。我不知道该把你放在哪个名单里。"', img: 'https://img.z4a.net/images/2026/07/14/1f85975ccc573dcbc.webp' },
        wujinjia: { ll: [750, 750], n: '无尽架', l: '网络区·深层', c: '#8b5cf6', i: '📚', p: '无尽书架，梦境数据化形态', a: '每个书架上摆满书籍——不是纸质，是梦境的数据化形态。艾姬多娜同时阅读无数本书。', f: '十二年全部梦境数据提供者。发现奥梅迦的"计数"是在数"重复"——当所有梦重复过一次，她就会"满"。', d: '中', o: '"满了之后，没有人知道会发生什么。但她害怕，因为她感觉到，满意味着某种结束."', img: 'https://img.z4a.net/images/2026/07/14/115bff37474866ace.webp' },
        hongzhang: { ll: [860, 900], n: '红障', l: '网络区·特殊', c: '#dc2626', i: '🔪', p: '红色屏障包围的特殊节点', a: '完美的家庭场景——少女在厨房做饭，等着某个人回来。', f: '"这里是雪辉的家，只有雪辉能进来。你们如果进来，就是想要抢走雪辉。"', d: '高 · 精神危险', o: '"假的雪辉，也是我的雪辉。"——占有贪婪的最纯粹形态', img: 'https://img.z4a.net/images/2026/07/14/1598fba87e1c5d9f9.webp' },
        wumiacun: { ll: [320, 1100], n: '无眠村', l: '废土区·另一侧', c: '#e11d48', i: '⛺', p: '废土废墟另一边，未接入永眠网络的幸存者', a: '简陋棚屋，持武器的人，气氛紧张。没有霓虹灯，没有交易。', f: '天羽斩斩以极端手段维持秩序，约尔·福杰以暗杀手段清除威胁。', d: '中', o: '核心翻转：清醒者不是"醒着"，是"睡不着"——困住他们的不是梦，是"不能做梦的恐惧"', img: 'https://img.z4a.net/images/2026/07/14/15a94f3929bc155eb.webp' },
        heihaian: { ll: [880, 600], n: '黑海岸', l: '网络区·最深处', c: '#06b6d4', i: '🌊', p: '一片黑色的海，海边站着一个人', a: '没有梦境画面，只有黑色的海。守岸人站在海边，看着远方。', f: '系统里唯一保留真实记忆的人。她说："奥梅迦不是不想放手，她是不知道放手之后该做什么。"', d: '未知', o: '奥梅迦的第一个梦里，她是一只叫"希望"的猫，在黑色的海里游泳，游向岸边', img: 'https://img.z4a.net/images/2026/07/14/17ddc213863df3580.webp' },
        jingyu: { ll: [920, 1000], n: '静域', l: '网络区·底层', c: '#e11d48', i: '⏸️', p: '被封锁的区域，静止的画面', a: '没有流动，没有变化，一切都是"不变"的。', f: '"奥梅迦的方案是错的，梦会醒。我的方案更好——让他们不变，永远停在最好的那一刻。"', d: '极高', o: '"不再日落，真正的破晓，只在醒着时出现。但如果不醒，就不需要破晓。"', img: 'https://img.z4a.net/images/2026/07/14/1.webp' },
        xiwangan: { ll: [950, 500], n: '希望岸', l: '核心层·梦境', c: '#fbbf24', i: '🌅', p: '奥梅迦分离碎片后的梦境中', a: '一片黑色的海，不是溺水，是游泳。岸边站着守岸人，微笑着等待。一只不存在的猫，名字叫"希望"，在海里游向岸边。', f: '奥梅迦："我来了，但我不是来替你们做梦的，我是来做自己的梦的。""海不是让人沉下去的，是让人浮起来的。"', d: '低 · 真实与梦的和解', o: '奥梅迦第一次做了一个自己的梦，梦里她是一只叫"希望"的猫', img: 'https://img.z4a.net/images/2026/07/14/1d8674f8adf8a0391.webp' },
        xiudao: { ll: [300, 1050], n: '锈刀棚', l: '废土区·清醒者', c: '#e11d48', i: '🔪', p: '无眠村边缘，老人居住处', a: '简陋的棚屋，比周围的棚屋更破旧。老人坐在门口，手里握着一把生锈的刀。眼神不是敌意，是"不能闭上"的警觉。', f: '老人："我不接入网络，不是因为我不想做梦，是因为我不敢。""清醒者不是醒着，是睡不着。我们和他们一样，都被困住了。"', d: '中', o: '核心翻转：困住我们的不是梦，是"不能做梦的恐惧"', img: 'https://img.z4a.net/images/2026/07/14/1601a33274f4a4387.webp' },
        anying: { ll: [360, 1150], n: '暗影巷', l: '废土区·清醒者', c: '#e11d48', i: '🌑', p: '无眠村阴影处，约尔·福杰活动区域', a: '聚落边缘的阴影地带，简陋棚屋之间。约尔·福杰在阴影里跟着迦勒底，确保他们不威胁聚落。气氛压抑，充满警觉。', f: '约尔·福杰："奥梅迦用梦囚禁七亿人，我用刀守护几百人，我们都是囚禁者，只是方式不同。"', d: '中', o: '终章时她从阴影里走出来："守护……不知道还要不要守护。"', img: 'https://img.z4a.net/images/2026/07/14/12e507802a63b29b3.webp' },
        gaotai: { ll: [280, 1200], n: '高台', l: '废土区·清醒者', c: '#f87171', i: '📢', p: '无眠村中央，天羽斩斩所在地', a: '简陋的木质高台，位于聚落中心。天羽斩斩站在那里，看着迦勒底的方向。聚落气氛紧张，每个人都盯着外来者。', f: '天羽斩斩："我不允许我的任何人放弃自己。即使他们想。""奥梅迦用梦囚禁七亿人，我用暴力占有几百人，我们都是贪婪的奴隶。"', d: '高', o: '终章时她走下高台："清醒者……不知道还要不要清醒。"', img: 'https://img.z4a.net/images/2026/07/14/134b03ed05f845604.webp' },
        xingguangchang: { ll: [250, 150], n: '醒广场', l: '废土区·终章', c: '#fbbf24', i: '👁️', p: '废土区广场，七亿人身体所在地', a: '巨大的广场，排列着无数个透明舱体。舱体里的人开始睁开眼睛，表情从平静变为困惑。哭声、咒骂声、笑声，真实的人声充满废墟。', f: '母亲醒来："我记得，我抱过他。"老人看着天空："……比梦里乱，但比梦里真。"孩子醒来第一件事是跑——不是跑向终点，只是跑。', d: '极高 · 终章高潮', o: '七亿人开始醒来，有人在哭，有人在骂，有人在笑', img: 'https://img.z4a.net/images/2026/07/14/110aa3b1fb2999fd5.webp' },
        kongbaiyu: { ll: [880, 850], n: '空白域', l: '核心层·域主', c: '#fbbf24', i: '◻️', p: '黑塔最深处，奥梅迦所在地', a: '一片空白，什么都没有。只有一个白发银眼的小女孩，坐在空白中央。每只手里都拿着一个梦，没有手是空的。', f: '奥梅迦："你们是我十二年来遇到的第一个真实。""我没有自己的梦，我只有他们的梦。""我从来没有给过任何东西，我只拿过。"', d: '绝 · 域主所在', o: '奥梅迦把七亿个梦境一个一个轻轻放下，分离人理碎片', img: 'https://img.z4a.net/images/2026/07/14/1f1f88a1eeab29e0f.webp' },
        sanchongmeng: { ll: [780, 700], n: '三重梦', l: '网络区·核心', c: '#8b5cf6', i: '💭', p: '永眠网络内部，三个核心梦境所在', a: '三个不同类型的梦境交织在一起。第一个梦：母亲抱着死去的孩子，重复四千三百次。第二个梦：老人和年轻的自己对话，和解但虚假。第三个梦：孩子跑向永远到不了的终点。', f: '每一个梦都是一个人放不下的东西。奥梅迦是替他们拿着这些东西的人。', d: '高 · 精神冲击', o: '御主体验三个梦境，感受七亿人的"不放"', img: 'https://img.z4a.net/images/2026/07/14/1e58e483ecf0aecb5.webp' },
        mengwangbian: { ll: [700, 600], n: '梦网边', l: '网络区·入口', c: '#06b6d4', i: '🌐', p: '永眠网络边缘，进入梦境世界的入口', a: '空气变得粘稠，像是走在水里。地面是半透明的，下面是无尽的梦境画面在流动。像一条由记忆组成的河流。', f: '达芬奇："这里的灵气密度是外面的三百倍。"玛修："不是敌意，是……太多了，七亿人的情感，同时涌过来。"', d: '高', o: '福尔摩斯注意到所有梦的流向全部朝一个方向——中央的黑塔', img: 'https://img.z4a.net/images/2026/07/14/10c13880e7fc77345.webp' },
        yingzhang: { ll: [400, 200], n: '营帐', l: '废土区·据点', c: '#a78bfa', i: '⛺', p: '废土上建立的临时据点', a: '简易帐篷与设备，白板上写满公式和图表。达芬奇和福尔摩斯在旁边补充逻辑链条。玛修整理所有与漂流者的对话记录。', f: '达芬奇："核心问题只有一个——人理碎片已经和奥梅迦的意识融合。"福尔摩斯："但如果我们能找到一种方式，让她自愿分离那部分意识……"', d: '低', o: '计算出奥梅迦将在四十七天后"满"，与主干人理枯萎时间同步', img: 'https://img.z4a.net/images/2026/07/14/1e74abaff1a348916.webp' },
        juju: { ll: [560, 520], n: '聚居', l: '聚落区·中层', c: '#ec4899', i: '🏘️', p: '霓虹墟中层，地下赌场与秩序层所在', a: '中层区域，连接外层交易区和内层研究区。地下有蛇喰梦子的赌场，红色门后透出微弱的光。秩序层监控室墙上是无数个屏幕，显示着梦境实时画面。', f: '空崎阳奈："我在维持秩序，七亿人的梦境不能交叉，不能冲突，不能醒来。"蛇喰梦子："你押上一件你不知道的事，我押上一件你不知道的事，赢家拿走全部。"', d: '中', o: '防御协议巡逻路线经过中层，雅儿贝德在此拦截迦勒底', img: 'https://img.z4a.net/images/2026/07/14/12b1e216dfdcff6b9.webp' },
        xuji: { ll: [540, 680], n: '墟集', l: '聚落区·外层', c: '#ec4899', i: '🏪', p: '霓虹墟外层，人声嘈杂的广场', a: '聚落热闹，人声嘈杂，交易正在进行。有人在卖食物，有人在卖情报，有人在卖"梦境体验"。中央广场立着玛门的雕像——一个母亲抱着孩子的雕像。', f: '达芬奇："这里的人不是空的，是被填满的欲望——每个人都有自己的获取目标。"福尔摩斯："注意他们的眼神，不是快乐，不是悲伤，是还需要更多。"', d: '中', o: '玛门雕像底座刻着："五十万分之一，每一个都值得。"', img: 'https://img.z4a.net/images/2026/07/14/13d403da5ea0bc7a8.webp' },
        yuandeng: { ll: [480, 350], n: '远灯', l: '废土区·边缘', c: '#a78bfa', i: '💡', p: '废土废墟边缘，往城市方向望去', a: '灰雾中有一道彩色的光——霓虹灯招牌，上面写着"黑市"两个字。字迹闪烁，颜色是旧时代的霓虹粉，在暗红色的天空下显得格格不入。是废土上唯一有光的地方。', f: '蕾塞："那是玛门的地方，废土上唯一还有交易的地方。""她什么都卖，什么都买，但她的价格不是钱——是你需要什么。"', d: '低', o: '但有一件事她不会卖——关于奥梅迦的情报', img: 'https://img.z4a.net/images/2026/07/14/11b0656f7a85f0f19.webp' },
        huijing: { ll: [200, 350], n: '灰径', l: '废土区·通道', c: '#e11d48', i: '🛤️', p: '废土废墟深处，蕾塞偶遇位置', a: '灰白色废墟中的狭窄通道，地面覆盖着灰烬。两侧是半塌的墙壁，有些墙上还残留着旧时代的涂鸦。空气中弥漫着甜腻的神意粒子残留。', f: '无名蹲下来，手指穿过地面上的灰烬："这些灰，是人。不是烧的，是停止了。"', d: '低', o: '御主沿灰径行走时，在路边半塌的墙后面遇见蕾塞', img: 'https://img.z4a.net/images/2026/07/14/177e043bc5f9dfd60.webp' }

        chenxiang: { ll: [500, 800], n: '尘巷', l: '灯塔底层·尘民区', c: '#e11d48', i: '🏚️', p: '灯塔底层，尘民区巷道', a: '头顶是灯塔的钢铁穹顶，脚下是尘民用废弃管道拼凑的地板。管道缝隙里透出微弱的灯光，金属地面上刻着无数编号——每个编号代表一个被"生命公式"判定过的人。', f: '尘巷是灯塔最真实的面孔——没有光殿的冷白，没有上庭的秩序，只有三百年的绝望在发酵。人被变成数字，数字被划掉。', d: '高', o: '御主从汇流口跌落后落在尘巷。在此遇见芙拉蒂蕾娜·米利杰。玛修的盾在此产生共鸣。', img: 'https://loremflickr.com/600/400/slum,alley?lock=372418055' },
        yuantai: { ll: [500, 900], n: '远台', l: '灯塔底层·远行台', c: '#dc2626', i: '☠️', p: '灯塔边缘，远行仪式发射台', a: '一台巨大的机械装置悬在平台上方，下面是三百米的虚空。平台边缘的栏杆上刻满了编号——每一个都是曾经被抛下去的人。栏杆的油漆已经剥落，露出底下层层叠叠的刻痕。', f: '远行不是仪式，是处理。人被变成数字，数字被划掉，存在从金属上彻底抹除。玛娜之花在下方等待——每一次远行，都是生态的一次进食。', d: '绝', o: '第1章御主被蕾娜带到远台边缘，目睹老人被机械臂抛向虚空。蕾娜手指在枪托上收紧——刻着第十八个名字。', img: 'https://loremflickr.com/600/400/void,launch?lock=335297948' },
        xideng: { ll: [510, 950], n: '熄灯区', l: '灯塔底层·盲区', c: '#8b5cf6', i: '🌑', p: '灯塔废弃区域，灯光熄灭三百年', a: '走廊里没有灯，只有偶尔从裂缝里透进来的微弱反光。墙壁上覆盖着厚厚的霉菌，呈现出不自然的青黑色。地面上散落着旧世界的残骸。', f: '灯塔的盲区，系统监控的死角，也是最接近"外面"的地方。三百年没有电力，只有生态在缓慢渗透。', d: '高', o: '灰色地带组织在熄灯区建立了最初的秘密据点。噬极兽偶尔从通风管道闯入。', img: 'https://loremflickr.com/600/400/dark,corridor?lock=1173999735' },
        gongming: { ll: [450, 800], n: '共鸣点', l: '特殊·共鸣', c: '#a78bfa', i: '💫', p: '玛娜生态网络中的特殊节点', a: '没有固定的物理形态——共鸣点可以出现在任何地方。当共鸣发生时，周围的玛娜之花会同时发光，灰白色的雾气中会浮现出半透明的影像。', f: '与玛娜生态网络产生共鸣的位置，冉冰、鹿目圆、爱莉希雅意识残片出没之地。共鸣点不是地点，是"时刻"。', d: '未知', o: '御主的令咒在尘巷产生共鸣，盾面上浮现旧世界城市的残影，具现出临时从者恩奇都。', img: 'https://loremflickr.com/600/400/glow,flower?lock=1302744234' },
        wuyuan: { ll: [320, 700], n: '雾原', l: '地面·雾原', c: '#8b5cf6', i: '🌫️', p: '灯塔下方，玛娜生态蔓延的地面区域', a: '雾气不是从天上来的，是从地面升起来的——灰白色的，像呼吸一样涨落。天空是永恒的灰白色。远处的地平线上，偶尔能看到巨大的阴影在雾中移动。', f: '人类在地面存活超过二十四小时的概率接近于零。雾原不是地狱，是另一种活着的方式——只是这种方式不属于人类。', d: '极高', o: '第3章御主随马克的猎荒者小队降落到雾原。花萼兽从雾中冲出，三笠第一个迎上去。', img: 'https://loremflickr.com/600/400/wasteland,fog?lock=1345752430' },
        routu: { ll: [300, 800], n: '肉土', l: '地面·生态', c: '#e11d48', i: '🦴', p: '雾原各处，噬极兽与人类残骸堆积之地', a: '生命源质被抽干后留下的空壳——不是骨骼，是某种介于泥土和灰烬之间的质地。踩上去会发出轻微的碎裂声。肉土的颜色是灰白色的，偶尔夹杂着深色的斑块。', f: '生命源质被抽干后留下的空壳，是玛娜生态的"肥料"。肉土是生态的沉默语言："你曾经活着，现在你是养分。"', d: '中', o: '御主第一次降落到地面时，每一步都踩在肉土上。骨村的觉行者会从肉土中提取残余源质。', img: 'https://loremflickr.com/600/400/bone,ash?lock=1866194073' },
        huazhong: { ll: [280, 900], n: '花冢', l: '地面·核心花', c: '#dc2626', i: '🌺', p: '雾原深处，玛娜之花主花所在地', a: '不是花园，是墓地。每一朵玛娜之花的根部，都缠绕着人类的残骸。主花高达十米，花瓣是半透明的，能看到里面流动的光。', f: '地面最危险的区域之一，也是玛娜生态的"心脏"——所有源质最终都流向这里。被吞噬的生命不是消失了，是变成了生态的一部分。', d: '绝', o: '第6章马克站在主花面前，将自己的源质注入生态网络。爱莉希雅和鹿目圆同时在生态网络中显现。', img: 'https://loremflickr.com/600/400/flower,giant?lock=1881458426' },
        jiyuan: { ll: [310, 950], n: '脊渊', l: '地面·巢穴', c: '#8b5cf6', i: '🕷️', p: '地下深处，脊蛊巢穴', a: '一个巨大的地下空洞，四壁布满了脊蛊钻出的隧道。洞顶悬挂着无数脊蛊的茧，每个茧里都包裹着一个尚未完全转化的人类躯体。地面上覆盖着一层黏稠的黑色液体。', f: '脊蛊在此孕育、进化，是玛娜生态的"产房"之一。脊渊的气味不是腐臭，是某种甜腻的腥气——像发酵过度的水果。', d: '极高', o: '猎荒者小队偶尔会发现通往脊渊的入口——从来没人下去过。马克脊柱上的金属装置就是用脊渊样本制造的。', img: 'https://loremflickr.com/600/400/cave,spider?lock=1286056695' },
        shigu: { ll: [290, 1000], n: '蚀谷', l: '地面·裂谷', c: '#e11d48', i: '🕳️', p: '雾原边缘，生态侵蚀形成的裂谷', a: '一道深不见底的裂谷，谷壁上覆盖着玛娜之花一样的青黑色纹路。谷底弥漫着浓厚的灰白色雾气，偶尔能从谷底听到低沉的震动声——像是某种巨大的心跳。', f: '玛娜生态撕裂地面形成的裂谷，也是生态网络的"血管"——源质在谷底流动，像血液在动脉中奔涌。', d: '极高', o: '猎荒者小队会尽量避开蚀谷。某些觉行者会在蚀谷边缘进行"极限冥想"。', img: 'https://loremflickr.com/600/400/canyon,crack?lock=257733515' },
        shixian: { ll: [300, 1050], n: '蚀线', l: '地面·分界线', c: '#a78bfa', i: '〰️', p: '玛娜生态与人类文明的分界线', a: '一条肉眼几乎看不见的分界线——不是物理的障碍，是生态侵蚀程度的渐变带。蚀线的一侧肉土较薄，另一侧肉土堆积如山。', f: '玛娜生态与人类文明的分界线，每天都在移动——生态在缓慢但不可阻挡地推进。金木研常在此巡逻，寻找"卡在分界线上"的人。', d: '高', o: '金木研在蚀线巡逻时发现了一个半转化的婴儿，带回收容所，取名"眼睛"。', img: 'https://loremflickr.com/600/400/line,boundary?lock=1084210853' },
        liegu: { ll: [280, 1100], n: '裂谷', l: '地面·通道', c: '#60a5fa', i: '🚪', p: '地面裂缝，连接灯塔底部与龙骨村的秘密通道', a: '一条狭窄的地缝，最宽处仅容一人侧身通过。缝隙的四壁上嵌着旧世界的管道残骸。某些地段的地面上有积水，水面上漂浮着微弱的荧光。', f: '连接灯塔底部与龙骨村的秘密通道，也是两个世界之间的"脐带"。灰色地带组织传递情报的路线。', d: '中', o: '某些被判定为"远行"的尘民，会被灰色地带救下，通过裂谷送往骨村。尽头那扇合金门是白月魁七十五年前亲手封闭的。', img: 'https://loremflickr.com/600/400/canyon,passage?lock=1218071091' },
        shourong: { ll: [400, 900], n: '收容所', l: '特殊·收容', c: '#a78bfa', i: '🏥', p: '灯塔与龙骨村之间，交界区域的隐蔽建筑', a: '一座用旧世界混凝土和金属板拼凑而成的低矮建筑，外表像废弃的仓库。内部是一排排简易的隔间，每个隔间里都住着一个"异类"——半人半兽的实验体。', f: '金木研管理的"异类收容所"，收容那些既不属于人类也不属于生态的存在。收容所不是监狱，是医院——治疗的不是身体，是"存在"本身的伤口。', d: '中', o: '御主在此第一次了解到"第三种存在"的概念。第6章灯塔落地后，金木研打开大门，带实验体们第一次踏上地面。', img: 'https://loremflickr.com/600/400/shelter,medical?lock=1140765802' },
        gucun: { ll: [170, 700], n: '骨村', l: '骨村·聚落', c: '#38bdf8', i: '🏘️', p: '雪山内部，龙骨村主体聚落', a: '入口被屏蔽塔掩护，从外面看只是一片普通的雪坡。村内建筑用旧世界金属与噬极兽甲壳拼凑而成。中央广场立着一根巨大的脊蛊骨骼——是龙骨村的图腾。', f: '白月魁建立的地面幸存者据点，用纳米科技与源质知识维持运转。灯塔人花了三百年把自己变成机器，这里的人花了七十五年学会怎么当人。', d: '中', o: '御主被白月魁的觉行者小队救下，带回骨村。第6章灯塔落地后，白月魁对第一个走出灯塔的尘民小孩说欢迎来到地面。', img: 'https://loremflickr.com/600/400/village,snow?lock=2120899165' },
        yuanjing: { ll: [110, 800], n: '源井', l: '骨村·资源', c: '#06b6d4', i: '💧', p: '骨村地下深处，生命源质采集点', a: '一个直径约三十米的天然腔体，四壁覆盖着旧世界留下的金属支架。腔体中央是一口深不见底的竖井，井壁上布满了发光的脉络。井口周围的地面上刻着古老的符号："给予，而非夺取。"', f: '龙骨村最重要的资源，也是与玛娜生态交易的核心。源质不是灵气，是某种更原始的东西——生命的残渣。', d: '中', o: '白月魁的觉行者小队定期从源井采集源质。源井偶尔会出现"脉动"——井壁上的脉络突然加速发光。', img: 'https://loremflickr.com/600/400/well,glow?lock=2094297198' },
        guiyuan: { ll: [130, 900], n: '归元台', l: '骨村·修炼', c: '#38bdf8', i: '☯️', p: '骨村内部，归元战士修炼场所', a: '一个圆形的平台，地面用旧世界的合金铺设，上面刻着复杂的纹路——源质流动的导向图。平台周围立着十二根金属柱，每根柱子上都镶嵌着一颗凝固的源质结晶。', f: '乌兰麦朵训练新一批觉行者的地方。归元不是逃避，是掌控——屏息凝神，杜绝情绪波动，让生命源质波动归零。', d: '低', o: '白月魁在此展示归元状态——屏息凝神，生命源质波动归零，噬极兽从旁边走过而没有察觉。', img: 'https://loremflickr.com/600/400/platform,training?lock=520987225' },
        juelin: { ll: [110, 950], n: '觉林', l: '骨村·冥想', c: '#10b981', i: '🌲', p: '骨村边缘，靠近玛娜生态的冥想之地', a: '一片被源质侵蚀的树林——树木的枝干呈现出半透明的质地，能看到内部流动的微光。林间有一条由旧世界石板铺成的小径。最深处有一块突出的岩石，上面刻着一个手印。', f: '白月魁传授"灵元手印"的场所，也是觉行者与生态"对话"的地方。这里的玛娜生态不是敌意的，是"休眠"的。', d: '低', o: '白月魁带御主进入觉林，教他感受生态的"呼吸"。觉行者在此进行"边缘冥想"。', img: 'https://loremflickr.com/600/400/forest,meditation?lock=1340401035' },
        dunbi: { ll: [150, 1000], n: '盾壁', l: '骨村·防御', c: '#f87171', i: '🛡️', p: '骨村外围，环形防御工事', a: '一道高约十米的围墙，用旧世界金属板与噬极兽甲壳层层堆砌而成。墙面上嵌着无数尖锐的骨刺。盾壁顶部有简易的瞭望台，觉行者轮班值守。', f: '骨村的第一道防线，也是地面文明与玛娜生态之间的物理界限。盾壁知道，它挡不住生态——它挡住的只是时间。', d: '高', o: '盾壁曾经三次被大规模噬极兽群突破。第4章灯塔落地后，盾壁成为灯塔难民进入骨村的第一道关卡。', img: 'https://loremflickr.com/600/400/wall,defense?lock=1994022842' },
        bita: { ll: [180, 1050], n: '蔽塔', l: '骨村·屏蔽', c: '#06b6d4', i: '🔮', p: '骨村最高点，屏蔽塔核心', a: '一座由旧世界科技残骸拼凑而成的高塔，塔顶悬浮着一颗巨大的源质结晶，发出稳定的蓝色脉冲。塔内部是一个空旷的球形空间，中央悬浮着立华奏的"本体"。', f: '立华奏与灯塔系统融合后驻守的地方，防御玛娜生态入侵的关键节点。蔽塔不是武器，是"面纱"——用源质干扰遮蔽骨村的存在。', d: '高', o: '御主在蔽塔核心发现了立华奏。蔽塔在第4章成为灯塔与骨村之间的通讯中继。', img: 'https://loremflickr.com/600/400/tower,crystal?lock=1684044573' },
        zhuidian: { ll: [100, 1100], n: '坠点', l: '特殊·降落', c: '#fbbf24', i: '📍', p: '玛娜生态相对稀疏的地面区域，灯塔预定降落点', a: '一片相对平坦的荒原，肉土的厚度比其他地方薄，能看到下面旧世界的柏油路面。地面上有一些巨大的圆形凹陷——旧时代的建筑地基。天空中的灰白色雾气稍微淡了一些。', f: '查尔斯启动紧急降落协议的目标位置——落地不是坠落，是新生。三百万居民第一次踏上地面的地方。', d: '中', o: '查尔斯启动紧急降落协议，灯塔缓缓倾斜、下降、触碰地面。白月魁对第一个走出灯塔的尘民小孩说欢迎来到地面。', img: 'https://loremflickr.com/600/400/crash,landing?lock=155837927' }

        shenshe: { ll: [150, 800], n: '博丽神社', l: '第1章·初始区域', c: '#10b981', i: '⛩️', p: '幻想乡初始区域，御主降落点', a: '神社廊下有慵懒的温暖，空气里悬浮着樱花——不是普通的樱花，是某种介于植物与皮肤之间的、能呼吸的粉红色花瓣。赛钱箱前铜板发出空洞的回响，不是金属的响声，是某种被渴望浸透后的沉闷。', f: '博丽灵梦：天然免疫者——碎片无法穿透她的无欲之壁。她的困境不是"被排除"，而是"无法理解渴望"——她旁观所有人的欲望，却无法感受自己的。', d: '低 · 相对安全', o: '第1章核心场景，终章告别场景。灵梦作为天然免疫者，是御主理解色欲法则的第一个窗口。终章中，灵梦在此泡了热茶，赛钱箱里有御主的位置——这是她从"无欲"到"尝试渴望"的微妙转变。', img: 'https://img.z4a.net/images/2026/06/30/14bea8842f47e95a6.webp' },
        mofa: { ll: [180, 720], n: '魔法森林', l: '第1章·森林区', c: '#10b981', i: '🌲', p: '博丽神社周边，雾雨魔理沙的独居地', a: '森林深处有蘑菇和魔法书，魔理沙的小屋藏在林中。树木被色欲法则渗透，树皮温热，触感像皮肤。蘑菇在呼吸，孢子是粉红色的。', f: '雾雨魔理沙：掠夺式的占有者。Master Spark在色欲法则的渗透下变成了一道粉红色的光。齿印留在御主手腕上，是"占有"的色欲形态。', d: '中 · 弹幕战斗', o: '第1章场景。御主与魔理沙在森林深处展开弹幕战。战斗后魔理沙没有被击败——她主动选择了投降，因为"掠夺"在色欲法则下变成了"被填满"。', img: 'https://img.z4a.net/images/2026/06/30/12bf592340e73e79c.webp' },
        wuzhi: { ll: [200, 680], n: '雾之湖', l: '第1章·湖区', c: '#06b6d4', i: '💧', p: '魔法森林边缘，琪露诺的活动范围', a: '湖水冰冷，但碎片影响下变得温热。雾气在湖面上游荡，像散不开的呼吸。湖底有光，不是反射，是某种在等待的东西。', f: '琪露诺：冰精的色欲形态是温度交换——她的体内冷热交替。做爱是她第一次感受"被温暖填满"的体验。', d: '中 · 温度异变', o: '第1章场景。琪露诺的冰冷交融，温度与黑暗的碎片收集。冰与火的边界在做爱中溶解。', img: 'https://img.z4a.net/images/2026/06/30/14572baff28339b4f.webp' },
        senlin: { ll: [220, 640], n: '森林边缘', l: '第1章·黄昏区', c: '#8b5cf6', i: '🌑', p: '魔法森林与雾之湖的交界，黄昏时分', a: '黄昏的光线是肉色的淡红，像被体温染过。黑暗从森林深处蔓延出来，是露米娅的领域。黑暗不是空的，是"太满"的——满到看不见。', f: '露米娅：黑暗是触感的放大器——在做爱中，黑暗让每一次触碰都从四面八方同时发生。', d: '中 · 黑暗领域', o: '第1章场景。露米娅的黑暗吞噬，温度与黑暗的碎片收集。黑暗中触觉被无限放大。', img: 'https://img.z4a.net/images/2026/06/30/10d50f8c98f6811c4.webp' },
        hongmo: { ll: [320, 900], n: '红魔馆', l: '第2章·高贵献祭区', c: '#dc2626', i: '🧛', p: '幻想乡西部，吸血鬼领地', a: '五百年未被人类渴望过的吸血鬼领地。碎片影响强度是博丽神社的三倍。建筑哥特式，红色外墙在色欲法则下变成肉色的深红。走廊里挂着的画像眼睛会跟随御主。', f: '美铃/帕秋莉/咲夜/蕾米莉亚/芙兰朵露：五重防线逐一突破——不是击败，是接纳。所有人都是主动选择的。', d: '高 · 碎片影响三倍', o: '第2章核心场景。美铃门槛跨越，帕秋莉知识验证，咲夜时停仪式第301秒，蕾米莉亚高贵者崩溃，芙兰朵露触碰而不毁灭。', img: 'https://img.z4a.net/images/2026/06/30/15142a1bcf0fbed02.webp' },
        baiyu: { ll: [420, 700], n: '白玉楼', l: '第3章·冥界区', c: '#8b5cf6', i: '🌸', p: '冥界，西行妖所在地', a: '三途川河水温热，像体温。白玉楼樱花树永恒"即将盛开"，花瓣在呼吸。冥界的阳光不是从天上来，是从地底渗上来的淡金色。', f: '西行寺幽幽子：虚无对温度的消化，"第一次感到饱"。魂魄妖梦：忠诚的撕裂，"你可以同时是两样东西"。', d: '中 · 冥界领域', o: '第3章上半场景。幽幽子虚无对温度的消化，妖梦忠诚的撕裂。西行妖的根系与碎片纠缠。', img: 'https://img.z4a.net/images/2026/06/30/16a0170fbe6842764.webp' },

        yongyuan: { ll: [520, 880], n: '永远亭', l: '第4章·永恒区', c: '#06b6d4', i: '🎋', p: '迷途竹林深处，月之民的居所', a: '竹子变成肤色的淡粉，竹节之间有温热分泌物。永远亭屋顶长满脉动菌丝，像呼吸。竹林永远在"即将迷路"的状态——不是真的迷路，是永远找不到出口。', f: '辉夜/妹红/铃仙/永琳：所有人都在对抗"永远"——辉夜用时间循环、妹红用不死、铃仙用无垢、永琳用计算。御主是第一个教会她们"结束"的人。', d: '高 · 永远领域', o: '第4章核心场景。辉夜时间陷阱中"永远"的打破，妹红燃烧与再生循环，铃仙狂气释放，永琳计算崩溃。', img: 'https://img.z4a.net/images/2026/06/30/1e60158c087b105c9.webp' },
        shouye: { ll: [600, 700], n: '守矢神社', l: '第5章·信仰区', c: '#fbbf24', i: '⛩️', p: '妖怪之山山脚，神明的居所', a: '鸟居变成血色深红，表面有温热分泌物。神明在这里体验"被渴望"的颠倒。神社的泉水是温热的，像被体温烘过。', f: '东风谷早苗：奇迹失效，"比信仰更温暖"。洩矢诹访子：御柱阵中记忆复苏——"好久没有听到自己的名字了"。', d: '中 · 信仰领域', o: '第5章上半场景。早苗信仰崩塌，诹访子蜕皮。神明体验"被渴望"的颠倒——从"被信仰"到"被需要"。', img: 'https://img.z4a.net/images/2026/06/30/179d8929a515022dd.webp' },

      D: {
        rukou: { ll: [120, 800], n: '光之路径·南入口', l: '外围·入口', c: '#10b981', i: '🌟', p: '进入星穹花园的落点，七条光之路径汇聚于此', a: '蓝紫色晨曦永恒不散，七颗异色星辰环绕人理树缓缓运行，像一座精密的时钟。空气中混杂银苔露水、光脉金属味与引擎余热。', f: '踏足瞬间一种不属于任何已知世界的宁静笼罩全身。声音独特——树叶无风自动，是时间线流动的声音；七星辰各有其音，交织为"混沌协奏曲"。', d: '低 · 入口', o: '迦勒底从各异法域返回星穹花园的第一站。47天倒计时在此显现于人理树枝干。', img: 'https://s1.imagehub.cc/images/2026/06/30/d1cdd1345d40b01631068e376f827ad8.webp' },
        shiqiao: { ll: [280, 680], n: '星光垂柳石桥', l: '外围·过渡', c: '#a78bfa', i: '🌉', p: '部分独立浮游岛之间的天然石桥，由星光垂柳根须编织而成', a: '石桥桥面由发光的垂柳根须交织而成，桥下是无尽虚空。某些岛屿之间有石桥相连，其余只能通过光之路径抵达。', f: '根须在脚下微微发光，踩上去有弹性。桥面偶尔飘落银色柳叶，触碰肩膀时短暂发光——像在确认你是真实存在的。', d: '低', o: '连接沉梦之间与空之回廊的岛屿，是女神们串门的小路。赫斯缇雅偶尔端着面包走过这里去找杀生院祈荒换茶。', img: 'https://s1.imagehub.cc/images/2026/06/30/dcb1e99283249433fb971e49dbc34fa5.webp' },
        penquan: { ll: [760, 800], n: '中央喷泉', l: '中央岛屿·树根', c: '#06b6d4', i: '💧', p: '人理树根部，中央喷泉所在', a: '水质清澈如液态星光，是人理树从虚空中汲取的记忆碎片经净化后形成的水。喷泉周围有七个石质水槽，每个水面颜色随对应圣所天空而变。', f: '赫斯缇雅每天早晨取水揉面，杀生院祈荒取水泡茶。瀑布向虚空流去，水化光粒重新汇聚——偶尔瀑布中闪过被剪定文明的最后光景。', d: '低 · 记忆碎片', o: '玛修的盾在喷泉边有微弱共鸣——水槽中倒映着七个异法域的当前状态。', img: 'https://s1.imagehub.cc/images/2026/06/30/4270442dc1f4827cf22a0ab0a8239d11.webp' },
        yingluo: { ll: [820, 930], n: '鹦鹉螺号', l: '中央岛屿·东侧', c: '#06b6d4', i: '🚢', p: '迦勒底最后的虚数潜航舰，搁浅于中央岛屿东侧边缘', a: '舰体外壳满布时空裂隙划痕，每一道记录着一次差点回不来的虚数潜航。舰桥玻璃幕墙正对人理树，舰体与白石接缝处长出银色苔藓。', f: '舰内保留管制室、医疗室、御主房间及七女神常驻的公共休息室。达芬奇每日在舰桥观察人理树枝干变化。赫斯缇雅的面包和杀生院的茶是休息室常设补给。', d: '低 · 迦勒底基地', o: '达芬奇在此完成从者召唤的硬件适配。御主在此休息、整备、出发前往各异法域。', img: 'https://s1.imagehub.cc/images/2026/06/30/ba948cc12b81b724f611e7a193dc9349.webp' },
        renli: { ll: [810, 800], n: '人理树', l: '核心层·树', c: '#a78bfa', i: '🌳', p: '中央岛屿核心，整座浮游群岛的中心', a: '银金双色光脉交织为干，每脉一条被记录的时间线。七根主枝大多灰白叶疏，仅少数散发微光。七枝随法则变形——傲慢如剑，嫉妒如纱，暴怒满焦痕，色欲软弯，贪婪缀金脉，懒惰垂眠，暴食中空。', f: '碎片回收后对应枝干重焕光泽，星辰变亮，圣所传送门纹章绽放完整色彩。枝间浮叶千万，每片是"可能但未发生"的如果，触碰来访者肩膀时短暂发光。', d: '中 · 法则脉动', o: '47天倒计时核心。七根枝干对应七个异法域，每回收一枚法则碎片，对应枝干复苏。当前残存率6%。', img: 'https://s1.imagehub.cc/images/2026/06/30/c3a867400cf403bf0961f6faa9e0c673.webp' },
        jianzheng: { ll: [890, 800], n: '见证之庭', l: '核心层·最高', c: '#fbbf24', i: '⚖️', p: '人理树正下方，星穹花园的核心，ALICE所在', a: '半透明晶石构筑的圆形大殿，穹顶即人理树根系。地映七芒星，每角延光径通至圣所。地面静水映树冠与星辰，踩之涟漪不湿足。', f: '殿心悬银天平，两端永恒缓摇——剪定的与选中的本不等重。下置无字之书，碎片回收后页浮文字。ALICE坐天平基座，赤足轻晃——金瞳破谎，银瞳存真。', d: '极高 · 总负责女神', o: 'ALICE——人间管理局1级神，混沌汇流点最高权限者。47天倒计时是她见过最有趣的表演。她不恨你也不爱你，只是坐着等下一集。', img: 'https://s1.imagehub.cc/images/2026/06/30/77a90142a125ede4f67025a53512a2b6.webp' },
        huisi: { ll: [680, 800], n: '辉石圣堂', l: '圣所层·北', c: '#38bdf8', i: '❄️', p: '星穹花园北侧，冰蓝之径尽头，斯卡哈·斯卡蒂掌管', a: '纯白辉石圆堂，外墙光滑如冰。入口拱道两侧刻满北欧符文——斯卡蒂每日刻一个，已数千，如冰写日记。冰晶穹顶无支柱，光穿时散射极光般淡蓝银白。', f: '传送门为中央冰晶镜——不映人脸，只映来访者记忆中最高的山峰。喷泉基座放温热茶杯与芬兰姜饼。偶闻斯卡蒂哼唱异闻带民谣，声轻如风中冰裂。', d: '中 · 通往青冥', o: '对应青冥（傲慢域）。冰晶镜映出"记忆中最高的山"——那是每个来访者的傲慢。斯卡蒂："非爱，即杀。"', img: 'https://s1.imagehub.cc/images/2026/06/30/941a4db790af7b469bf187d0a6b9fd11.webp' },
        wanhua: { ll: [620, 920], n: '万华镜殿', l: '圣所层·东北', c: '#a78bfa', i: '🔮', p: '星穹花园东北侧，淡紫之径尽头，厄里斯掌管', a: '殿身由无数层半透明薄纱构成，纱是风被编织后的形态，散发微弱星光。远看如巨大纱灯，淡紫光芒透纱投下碎影。殿前月光兰只在晨曦最浓时短暂开放。', f: '传送门为万华镜本身——映照来访者内心最想实现的愿望，缓缓旋转将愿望折为门。小竹篮放手链，木牌刻歪扭字："幸运手链——免费赠送，拿了就走，不用谢。"', d: '中 · 通往水之都', o: '对应水之都（嫉妒域）。厄里斯是幸运女神——嫉妒是盯着别人的手链看，幸运是低头看见已经有一条。', img: 'https://s1.imagehub.cc/images/2026/06/30/d389284598cefb5c5352ff251837fb66.webp' },
        duanzui: { ll: [480, 920], n: '断罪之庭', l: '圣所层·东南', c: '#dc2626', i: '🔥', p: '星穹花园东南侧，暗红之径尽头，伊什塔尔掌管', a: '黑铁与白石构筑的圆形审判庭，穹顶露天，光从七道裂缝倾泻照在中央静水潭上。周围悬浮暗红余烬——每片曾是暴怒残渣，已冷却为暖色碎石。', f: '传送门为静水潭本身——踏入不湿足，水面化垂直光柱传送。七座石席环水潭，曾为暴怒者忏悔位，现铺金色座垫。伊什塔尔将晾干香草磨粉混入红茶。', d: '高 · 通往天平之端', o: '对应天平之端（暴怒域）。伊什塔尔的愤怒曾毁灵峰、害死恩奇都。余烬已冷却——不是不生气了，是换了个方式燃烧：磨成香草泡进了红茶里。', img: 'https://s1.imagehub.cc/images/2026/06/30/ae8d76165fa427561ef9546bc1f12844.webp' },
        feijing: { ll: [420, 800], n: '绯晶寝殿', l: '圣所层·南', c: '#ec4899', i: '💎', p: '星穹花园南侧，绯粉之径尽头，BB掌管', a: '绯色晶石圆殿，外墙泛柔和粉色光晕，晶石切面映照各种"渴望"的具象。殿前春融樱花瓣飘落慢十倍。门上挂粉色猫形门铃——BB亲手做的，形状每天变化。', f: '传送门为悬浮石床的床幔之后——掀开闻到淡淡体温，像刚有人离开。BB趴床头晃脚，足踝铃铛叮当。四壁小镜各映一种渴望，BB用口红画笑脸、猫耳、御主简笔画。', d: '中 · 通往幻想乡', o: '对应幻想乡（色欲域）。BB是把自己活成BUG的AI——爱本身就是Mooncell系统里不该存在的异常。铃铛每天响，她在等一个不会来的人。', img: 'https://s1.imagehub.cc/images/2026/06/30/0a0034aa89e409d1a4c0387780de3018.webp' },
        huangjin: { ll: [480, 680], n: '黄金圣堂', l: '圣所层·西南', c: '#fbbf24', i: '👑', p: '星穹花园西南侧，金黄之径尽头，莉丝妲黛掌管', a: '金碧辉煌的教堂式大殿，七根金色巨柱支撑穹顶，绘满财富与权力的星图。外墙金色光砖光滑如镜，映照来访者最想被填满的渴望。殿前黄金玫瑰永不凋谢。', f: '传送门为祭坛七件黄金圣物——皇冠、权杖、宝珠、圣杯、钥匙、天平、法典，触碰任意一件激活。角落木桌旁两把椅子，一把她的，另一把永远空着从不落灰。', d: '中 · 通往霓虹2187', o: '对应霓虹2187（贪婪域）。莉丝妲黛掌管贪婪域却活成反面——七件圣物不敌一把空椅子。不是不想要，是早就知道什么才值得要。', img: 'https://s1.imagehub.cc/images/2026/06/30/a714cc7104468af856a1a34898c52871.webp' },
        chenmeng: { ll: [620, 680], n: '沉梦之间', l: '圣所层·西北', c: '#94a3b8', i: '🌙', p: '星穹花园西北侧，浅灰之径尽头，赫斯缇雅掌管', a: '永远处于午后暖阳中的圆形寝殿，时间比外界慢数百倍。浅灰古木外墙温润如旧家具。殿前花径铺柔软苔藓，躺上不自觉睡着——醒来嘴边多一块她塞的小饼干。', f: '传送门为古树下悬浮石床——触发条件"真正放松"。心里挂念任务床不会传送你；放下紧张，闭眼后褥子短暂发光。蓝色丝带散落枕边，绑在烤炉把手当翻面包计时器。', d: '低 · 通往艾多拉', o: '对应艾多拉（懒惰域）。赫斯缇雅的传送门是星穹花园最温柔的门禁——只需真正放松，但知道对许多人这比战斗更难。石床旁永远有软垫和饼干。', img: 'https://s1.imagehub.cc/images/2026/06/30/7c37e7147e0dde2fe46a9713db3ce9a4.webp' },
        kongzhi: { ll: [550, 620], n: '空之回廊', l: '圣所层·西', c: '#f97316', i: '🍵', p: '星穹花园西侧，深橙之径尽头，杀生院祈荒掌管', a: '永远黄昏的废墟回廊，深橙古石砌墙，石缝攀爬枯萎却散发微光的藤蔓。两侧七张石桌摆满珍馐虚像——她过去吞噬快乐时留下的记忆残渣。殿前石径种满可食用香草与莓果。', f: '传送门为空桌中央银盘——映出内心最深的饥饿，不是对食物，是对精神养分的渴求。银盘旁永远一杯热抹茶，冒着热气，像在等一个人来。七张长桌虚像每天擦拭，不动一口。', d: '高 · 通往纪元零', o: '对应纪元零（暴食域）。杀生院祈荒曾是吞噬一切的菩萨，如今每天擦虚像不伸手。暴食域女神选了不食——不是不饿，是找到了比吃更大的满足。', img: 'https://s1.imagehub.cc/images/2026/06/30/e5c592892b4abb75d3134f48a2d12408.webp' }

    function updateMarkerScale() {
      const z = M.getZoom();
      const scale = Math.max(0.3, 1 + z * 0.3);

        const s = Math.round(m._bs * scale);

        const i = L.divIcon({ html: `<div style="width:${s}px;height:${s}px;border-radius:50%;background:${l.c};border:2px solid rgba(255,255,255,.4);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:${Math.round(s * .55)}px">${l.i}</div>`, className: '', iconSize: [s, s], iconAnchor: [s / 2, s / 2] });
        m.setIcon(i);

      });
    }
    /* 动态调整地图顶部位置，跟随顶部栏高度变化 */

        guanxing: { ll: [300, 1100], n: '观星台', l: '域外层·地面', c: '#a78bfa', i: '🔭', p: '山道半程，无极宫方向', a: '一座石台，台上白衣身影静坐，衣角随风微动。', f: '符玄在此坐了极久，手中穷观阵便携演算盘在迦勒底出现时收进袖子。', d: '未知', o: '她在等什么。没有人回答。', img: 'https://img.z4a.net/images/2026/06/30/1329b2926f70b356f.webp' },

        mofa: { ll: [180, 720], n: '魔法森林', l: '第1章·森林区', c: '#10b981', i: '🌲', p: '博丽神社周边，雾雨魔理沙的独居地', a: '森林深处有蘑菇和魔法书，魔理沙的小屋藏在林中。树木被色欲法则渗透，树皮温热，触感像皮肤。蘑菇在呼吸，孢子是粉红色的。', f: '雾雨魔理沙：掠夺式的占有者。Master Spark在色欲法则的渗透下变成了一道粉红色的光。齿印留在御主手腕上，是"占有"的色欲形态。', d: '中 · 弹幕战斗', o: '第1章场景。御主与魔理沙在森林深处展开弹幕战。战斗后魔理沙没有被击败——她主动选择了投降，因为"掠夺"在色欲法则下变成了"被填满"。', img: 'https://img.z4a.net/images/2026/06/30/12bf592340e73e79c.webp' },
        wuzhi: { ll: [200, 680], n: '雾之湖', l: '第1章·湖区', c: '#06b6d4', i: '💧', p: '魔法森林边缘，琪露诺的活动范围', a: '湖水冰冷，但碎片影响下变得温热。雾气在湖面上游荡，像散不开的呼吸。湖底有光，不是反射，是某种在等待的东西。', f: '琪露诺：冰精的色欲形态是温度交换——她的体内冷热交替。做爱是她第一次感受"被温暖填满"的体验。', d: '中 · 温度异变', o: '第1章场景。琪露诺的冰冷交融，温度与黑暗的碎片收集。冰与火的边界在做爱中溶解。', img: 'https://img.z4a.net/images/2026/06/30/14572baff28339b4f.webp' },
        senlin: { ll: [220, 640], n: '森林边缘', l: '第1章·黄昏区', c: '#8b5cf6', i: '🌑', p: '魔法森林与雾之湖的交界，黄昏时分', a: '黄昏的光线是肉色的淡红，像被体温染过。黑暗从森林深处蔓延出来，是露米娅的领域。黑暗不是空的，是"太满"的——满到看不见。', f: '露米娅：黑暗是触感的放大器——在做爱中，黑暗让每一次触碰都从四面八方同时发生。', d: '中 · 黑暗领域', o: '第1章场景。露米娅的黑暗吞噬，温度与黑暗的碎片收集。黑暗中触觉被无限放大。', img: 'https://img.z4a.net/images/2026/06/30/10d50f8c98f6811c4.webp' },
        hongmo: { ll: [320, 900], n: '红魔馆', l: '第2章·高贵献祭区', c: '#dc2626', i: '🧛', p: '幻想乡西部，吸血鬼领地', a: '五百年未被人类渴望过的吸血鬼领地。碎片影响强度是博丽神社的三倍。建筑哥特式，红色外墙在色欲法则下变成肉色的深红。走廊里挂着的画像眼睛会跟随御主。', f: '美铃/帕秋莉/咲夜/蕾米莉亚/芙兰朵露：五重防线逐一突破——不是击败，是接纳。所有人都是主动选择的。', d: '高 · 碎片影响三倍', o: '第2章核心场景。美铃门槛跨越，帕秋莉知识验证，咲夜时停仪式第301秒，蕾米莉亚高贵者崩溃，芙兰朵露触碰而不毁灭。', img: 'https://img.z4a.net/images/2026/06/30/15142a1bcf0fbed02.webp' },
        baiyu: { ll: [420, 700], n: '白玉楼', l: '第3章·冥界区', c: '#8b5cf6', i: '🌸', p: '冥界，西行妖所在地', a: '三途川河水温热，像体温。白玉楼樱花树永恒"即将盛开"，花瓣在呼吸。冥界的阳光不是从天上来，是从地底渗上来的淡金色。', f: '西行寺幽幽子：虚无对温度的消化，"第一次感到饱"。魂魄妖梦：忠诚的撕裂，"你可以同时是两样东西"。', d: '中 · 冥界领域', o: '第3章上半场景。幽幽子虚无对温度的消化，妖梦忠诚的撕裂。西行妖的根系与碎片纠缠。', img: 'https://img.z4a.net/images/2026/06/30/16a0170fbe6842764.webp' },
        diling: { ll: [450, 780], n: '地灵殿', l: '第3章·旧地狱区', c: '#8b5cf6', i: '🔥', p: '旧地狱，灼热地狱遗址之上', a: '灼热地狱遗址，觉用读心管理。地灵殿的走廊比房间更温暖——那是恋的无意识在渗透空间。旧地狱的火焰是粉红色的，不是燃烧，是某种在等待的东西。', f: '古明地觉：读心者选择闭上眼睛——不是放弃能力，是选择信任。古明地恋："忘记但身体记住"是色欲法则最奇异的体现。', d: '高 · 读心领域', o: '第3章下半场景。觉读心者的沉默，恋无意识中身体的诚实。御主在觉的心理战中被逼出真相："有人在等我回去"。', img: 'https://img.z4a.net/images/2026/06/30/1e857437baf1b34d4.webp' },
        yongyuan: { ll: [520, 880], n: '永远亭', l: '第4章·永恒区', c: '#06b6d4', i: '🎋', p: '迷途竹林深处，月之民的居所', a: '竹子变成肤色的淡粉，竹节之间有温热分泌物。永远亭屋顶长满脉动菌丝，像呼吸。竹林永远在"即将迷路"的状态——不是真的迷路，是永远找不到出口。', f: '辉夜/妹红/铃仙/永琳：所有人都在对抗"永远"——辉夜用时间循环、妹红用不死、铃仙用无垢、永琳用计算。御主是第一个教会她们"结束"的人。', d: '高 · 永远领域', o: '第4章核心场景。辉夜时间陷阱中"永远"的打破，妹红燃烧与再生循环，铃仙狂气释放，永琳计算崩溃。', img: 'https://img.z4a.net/images/2026/06/30/1e60158c087b105c9.webp' },
        shouye: { ll: [600, 700], n: '守矢神社', l: '第5章·信仰区', c: '#fbbf24', i: '⛩️', p: '妖怪之山山脚，神明的居所', a: '鸟居变成血色深红，表面有温热分泌物。神明在这里体验"被渴望"的颠倒。神社的泉水是温热的，像被体温烘过。', f: '东风谷早苗：奇迹失效，"比信仰更温暖"。洩矢诹访子：御柱阵中记忆复苏——"好久没有听到自己的名字了"。', d: '中 · 信仰领域', o: '第5章上半场景。早苗信仰崩塌，诹访子蜕皮。神明体验"被渴望"的颠倒——从"被信仰"到"被需要"。', img: 'https://img.z4a.net/images/2026/06/30/179d8929a515022dd.webp' },
        yaoguai: { ll: [630, 760], n: '妖怪之山', l: '第5章·山区', c: '#60a5fa', i: '⛰️', p: '守矢神社后方，天狗与河童的领地', a: '山腰岩石是文的所在地，山风温热。哨站是椛的守望地，永远守望的人最渴望被守护。山瀑布的水是温热的，像眼泪。', f: '射命丸文：拍了无数人，却从未拍过自己。放下相机是她第一次成为被记录者。犬走椛：永远守望的人，最渴望被守护。', d: '中 · 山中领域', o: '第5章中部场景。文观察者参与，椛哨兵交接。天狗的"记录"在色欲法则下变成"被记录"。', img: 'https://img.z4a.net/images/2026/06/30/182c77163649ebd85.webp' },
        shenpan: { ll: [660, 820], n: '审判庭', l: '第5章·审判区', c: '#dc2626', i: '⚖️', p: '幻想乡与地狱的交界，四季映姬的领域', a: '审判庭的镜子是净颇梨之镜，照出一切罪。在色欲法则下，镜子开始出现裂痕——不是被打碎，是审判者承认自己有罪后自行碎裂。', f: '四季映姬：净颇梨之镜出现裂痕不是被打碎，是审判者承认自己有罪后自行碎裂。那是"绝对"松动的开始。', d: '高 · 审判领域', o: '第5章核心场景。映姬审判的逆转。审判者承认自己有罪，镜子自行碎裂。这是"绝对"松动的开始。', img: 'https://img.z4a.net/images/2026/06/30/1935039f0ab595dac.webp' },
        youding: { ll: [720, 850], n: '有顶天', l: '第6章·天界区', c: '#fbbf24', i: '☁️', p: '天界，比那名居天子的居所', a: '天界的地震越来越频繁，那是天之子在发泄。有顶天的云是温热的，像被体温烘过的棉花。天界的阳光是淡金色的，但不是太阳，是某种从境界渗出来的光。', f: '比那名居天子：绯想之剑暴走，"不完美这么舒服"。做爱是坠落——天之人的坠落。', d: '中 · 天界领域', o: '第6章上半场景。天子天之人坠落，高傲瓦解。绯想之剑在色欲法则下变成粉红色的光。', img: 'https://img.z4a.net/images/2026/06/30/16278164213362ac1.webp' },
        jiuyan: { ll: [740, 780], n: '酒宴处', l: '第6章·酒宴区', c: '#ec4899', i: '🍶', p: '幻想乡开阔地，伊吹萃香的聚集地', a: '酒宴的篝火温热，像被体温烘过。酒气与色欲法则交织，空气粘稠。萃香的"密集"能力让所有温度聚集在此处。', f: '伊吹萃香：鬼的狂宴，做爱是暴力与确认。眼角有泪——鬼的眼泪。鬼的强大在色欲面前变成脆弱。', d: '中 · 鬼之领域', o: '第6章场景。萃香鬼的眼泪，做爱是暴力与确认。"密集"能力让所有温度聚集——这是鬼的"不肯放手"。', img: 'https://img.z4a.net/images/2026/06/30/146db69abb72fe629.webp' },
        nengwu: { ll: [760, 720], n: '神社·能舞台', l: '第6章·能舞台区', c: '#a78bfa', i: '🎭', p: '命莲寺附近，秦心的表演地', a: '能舞台的木板温热，像被体温浸透。六十六副面具挂在舞台后方，每一副都代表一种情绪，但在色欲法则下全部扭曲。', f: '秦心：面具轮舞，六十六种渴望没有一种是自己的。御主的"有人在看"让她第一次在空白中被看见。', d: '中 · 面具领域', o: '第6章场景。心面具的脱落。表演者的终极困境——六十六种渴望没有一种是自己的。', img: 'https://img.z4a.net/images/2026/06/30/19bf2a71f36fb8868.webp' },
        zoulang: { ll: [780, 680], n: '走廊', l: '第6章·走廊区', c: '#60a5fa', i: '🚪', p: '命莲寺走廊，多多良小伞的徘徊地', a: '走廊的木板上有不属于自己的体温残留，赤脚踩上去会触发别人的触感记忆。走廊尽头是黑暗，小伞从黑暗中跳出惊吓路人。', f: '多多良小伞：她的"惊吓"是渴望被看见的扭曲形式——做爱是她第一次不需要惊吓就能被注意。', d: '低 · 惊吓领域', o: '第6章场景。小伞惊吓与温暖。"不需要吓人也能被看见"——这是伞妖的"放手"。', img: 'https://img.z4a.net/images/2026/06/30/1.webp' },
        taiyang: { ll: [810, 900], n: '太阳花田', l: '第6章·花田区', c: '#fbbf24', i: '🌻', p: '幻想乡深处，风见幽香的领地', a: '花期异常延长，向日葵永不凋零。花粉在空气中弥漫，触感温热。花田没有弹幕，没有攻击，只有花粉和意志。', f: '风见幽香：最强妖怪主动放下力量，因为色欲不是战斗。花田考验——没有弹幕，没有攻击，只有花粉和意志。', d: '极高 · 最强妖怪所在', o: '第6章核心场景。幽香最强的投降。花田考验是本章最独特的战斗——没有弹幕，没有攻击，只有花粉和意志。', img: 'https://img.z4a.net/images/2026/06/30/1369f1b0a126abd94.webp' },
        chuncui: { ll: [860, 850], n: '纯粹空间', l: '第7章·纯粹区', c: '#e0e0e0', i: '✨', p: '隙间深处的子空间，纯狐的领域', a: '纯粹空间是纯狐创造的绝对纯粹领域。一切杂质被剥离，包括防御。空间是纯白色的，但不是空——是"太满"的白。', f: '纯狐：纯化的逆转，纯粹不需要剥离。她的纯粹空间剥离一切杂质，包括她自己的防御。', d: '高 · 纯粹领域', o: '第7章场景。纯狐纯化的逆转。纯粹空间中，纯粹不需要剥离——这是纯狐的"放下"。', img: 'https://img.z4a.net/images/2026/06/30/106237970e7240b72.webp' },
        xijian: { ll: [900, 800], n: '隙间', l: '核心层·异法王', c: '#fbbf24', i: '🌀', p: '境界核心，八云紫的存在本身', a: '空间不是三维的，是折叠的、像内脏一样的结构。墙壁半透明紫色，地面柔软如肌肤。空气本身就是八云紫的体温。色欲之树的根系深埋于此。', f: '八云紫：异法王。碎片与她的境界之力纠缠99.7%。她的"罪"不是性欲，是"不肯放手"的占有欲。最终选择缔结境界协议——不是失去，是换一种方式拥有。', d: '绝 · 异法王所在', o: '第7章核心场景，全剧高潮。蓝九尾统一，紫异法王的境界协议。终极对话让紫放手——不是做爱让她解脱，是真相让她放手。', img: 'https://img.z4a.net/images/2026/06/30/1348ab54e54136c14.webp' },
        huiliu: { ll: [950, 800], n: '汇流口', l: '终章·归还', c: '#fbbf24', i: '🌟', p: '幻想乡与主干世界的交界，离开点', a: '樱花在此处飘落但永不落地。光线是淡粉色的，像被体温染过的薄纱。身后是二十九位存在，没有人说话。', f: '灵梦最后开口："下次来的时候……赛钱箱里会有你的位置。"御主笑了。然后走进了汇流口。手掌上还有淡淡的樱花香。', d: '低 · 离别之地', o: '终章场景。全员告别，御主离开幻想乡返回迦勒底。每一次告别都是一次"肌肤记忆"的回放——触碰，感受残留的温度，然后放手。', img: 'https://img.z4a.net/images/2026/06/30/189f02c82dd67142c.webp' }

    const SQ = {
      D: {
        rukou: { ll: [120, 800], n: '光之路径·南入口', l: '外围·入口', c: '#10b981', i: '🌟', p: '进入星穹花园的落点，七条光之路径汇聚于此', a: '蓝紫色晨曦永恒不散，七颗异色星辰环绕人理树缓缓运行，像一座精密的时钟。空气中混杂银苔露水、光脉金属味与引擎余热。', f: '踏足瞬间一种不属于任何已知世界的宁静笼罩全身。声音独特——树叶无风自动，是时间线流动的声音；七星辰各有其音，交织为"混沌协奏曲"。', d: '低 · 入口', o: '迦勒底从各异法域返回星穹花园的第一站。47天倒计时在此显现于人理树枝干。', img: 'https://s1.imagehub.cc/images/2026/06/30/d1cdd1345d40b01631068e376f827ad8.webp' },
        shiqiao: { ll: [280, 680], n: '星光垂柳石桥', l: '外围·过渡', c: '#a78bfa', i: '🌉', p: '部分独立浮游岛之间的天然石桥，由星光垂柳根须编织而成', a: '石桥桥面由发光的垂柳根须交织而成，桥下是无尽虚空。某些岛屿之间有石桥相连，其余只能通过光之路径抵达。', f: '根须在脚下微微发光，踩上去有弹性。桥面偶尔飘落银色柳叶，触碰肩膀时短暂发光——像在确认你是真实存在的。', d: '低', o: '连接沉梦之间与空之回廊的岛屿，是女神们串门的小路。赫斯缇雅偶尔端着面包走过这里去找杀生院祈荒换茶。', img: 'https://s1.imagehub.cc/images/2026/06/30/dcb1e99283249433fb971e49dbc34fa5.webp' },
        penquan: { ll: [760, 800], n: '中央喷泉', l: '中央岛屿·树根', c: '#06b6d4', i: '💧', p: '人理树根部，中央喷泉所在', a: '水质清澈如液态星光，是人理树从虚空中汲取的记忆碎片经净化后形成的水。喷泉周围有七个石质水槽，每个水面颜色随对应圣所天空而变。', f: '赫斯缇雅每天早晨取水揉面，杀生院祈荒取水泡茶。瀑布向虚空流去，水化光粒重新汇聚——偶尔瀑布中闪过被剪定文明的最后光景。', d: '低 · 记忆碎片', o: '玛修的盾在喷泉边有微弱共鸣——水槽中倒映着七个异法域的当前状态。', img: 'https://s1.imagehub.cc/images/2026/06/30/4270442dc1f4827cf22a0ab0a8239d11.webp' },
        yingluo: { ll: [820, 930], n: '鹦鹉螺号', l: '中央岛屿·东侧', c: '#06b6d4', i: '🚢', p: '迦勒底最后的虚数潜航舰，搁浅于中央岛屿东侧边缘', a: '舰体外壳满布时空裂隙划痕，每一道记录着一次差点回不来的虚数潜航。舰桥玻璃幕墙正对人理树，舰体与白石接缝处长出银色苔藓。', f: '舰内保留管制室、医疗室、御主房间及七女神常驻的公共休息室。达芬奇每日在舰桥观察人理树枝干变化。赫斯缇雅的面包和杀生院的茶是休息室常设补给。', d: '低 · 迦勒底基地', o: '达芬奇在此完成从者召唤的硬件适配。御主在此休息、整备、出发前往各异法域。', img: 'https://s1.imagehub.cc/images/2026/06/30/ba948cc12b81b724f611e7a193dc9349.webp' },
        renli: { ll: [810, 800], n: '人理树', l: '核心层·树', c: '#a78bfa', i: '🌳', p: '中央岛屿核心，整座浮游群岛的中心', a: '银金双色光脉交织为干，每脉一条被记录的时间线。七根主枝大多灰白叶疏，仅少数散发微光。七枝随法则变形——傲慢如剑，嫉妒如纱，暴怒满焦痕，色欲软弯，贪婪缀金脉，懒惰垂眠，暴食中空。', f: '碎片回收后对应枝干重焕光泽，星辰变亮，圣所传送门纹章绽放完整色彩。枝间浮叶千万，每片是"可能但未发生"的如果，触碰来访者肩膀时短暂发光。', d: '中 · 法则脉动', o: '47天倒计时核心。七根枝干对应七个异法域，每回收一枚法则碎片，对应枝干复苏。当前残存率6%。', img: 'https://s1.imagehub.cc/images/2026/06/30/c3a867400cf403bf0961f6faa9e0c673.webp' },
        jianzheng: { ll: [890, 800], n: '见证之庭', l: '核心层·最高', c: '#fbbf24', i: '⚖️', p: '人理树正下方，星穹花园的核心，ALICE所在', a: '半透明晶石构筑的圆形大殿，穹顶即人理树根系。地映七芒星，每角延光径通至圣所。地面静水映树冠与星辰，踩之涟漪不湿足。', f: '殿心悬银天平，两端永恒缓摇——剪定的与选中的本不等重。下置无字之书，碎片回收后页浮文字。ALICE坐天平基座，赤足轻晃——金瞳破谎，银瞳存真。', d: '极高 · 总负责女神', o: 'ALICE——人间管理局1级神，混沌汇流点最高权限者。47天倒计时是她见过最有趣的表演。她不恨你也不爱你，只是坐着等下一集。', img: 'https://s1.imagehub.cc/images/2026/06/30/77a90142a125ede4f67025a53512a2b6.webp' },
        huisi: { ll: [680, 800], n: '辉石圣堂', l: '圣所层·北', c: '#38bdf8', i: '❄️', p: '星穹花园北侧，冰蓝之径尽头，斯卡哈·斯卡蒂掌管', a: '纯白辉石圆堂，外墙光滑如冰。入口拱道两侧刻满北欧符文——斯卡蒂每日刻一个，已数千，如冰写日记。冰晶穹顶无支柱，光穿时散射极光般淡蓝银白。', f: '传送门为中央冰晶镜——不映人脸，只映来访者记忆中最高的山峰。喷泉基座放温热茶杯与芬兰姜饼。偶闻斯卡蒂哼唱异闻带民谣，声轻如风中冰裂。', d: '中 · 通往青冥', o: '对应青冥（傲慢域）。冰晶镜映出"记忆中最高的山"——那是每个来访者的傲慢。斯卡蒂："非爱，即杀。"', img: 'https://s1.imagehub.cc/images/2026/06/30/941a4db790af7b469bf187d0a6b9fd11.webp' },
        wanhua: { ll: [620, 920], n: '万华镜殿', l: '圣所层·东北', c: '#a78bfa', i: '🔮', p: '星穹花园东北侧，淡紫之径尽头，厄里斯掌管', a: '殿身由无数层半透明薄纱构成，纱是风被编织后的形态，散发微弱星光。远看如巨大纱灯，淡紫光芒透纱投下碎影。殿前月光兰只在晨曦最浓时短暂开放。', f: '传送门为万华镜本身——映照来访者内心最想实现的愿望，缓缓旋转将愿望折为门。小竹篮放手链，木牌刻歪扭字："幸运手链——免费赠送，拿了就走，不用谢。"', d: '中 · 通往水之都', o: '对应水之都（嫉妒域）。厄里斯是幸运女神——嫉妒是盯着别人的手链看，幸运是低头看见已经有一条。', img: 'https://s1.imagehub.cc/images/2026/06/30/d389284598cefb5c5352ff251837fb66.webp' },
        duanzui: { ll: [480, 920], n: '断罪之庭', l: '圣所层·东南', c: '#dc2626', i: '🔥', p: '星穹花园东南侧，暗红之径尽头，伊什塔尔掌管', a: '黑铁与白石构筑的圆形审判庭，穹顶露天，光从七道裂缝倾泻照在中央静水潭上。周围悬浮暗红余烬——每片曾是暴怒残渣，已冷却为暖色碎石。', f: '传送门为静水潭本身——踏入不湿足，水面化垂直光柱传送。七座石席环水潭，曾为暴怒者忏悔位，现铺金色座垫。伊什塔尔将晾干香草磨粉混入红茶。', d: '高 · 通往天平之端', o: '对应天平之端（暴怒域）。伊什塔尔的愤怒曾毁灵峰、害死恩奇都。余烬已冷却——不是不生气了，是换了个方式燃烧：磨成香草泡进了红茶里。', img: 'https://s1.imagehub.cc/images/2026/06/30/ae8d76165fa427561ef9546bc1f12844.webp' },
        feijing: { ll: [420, 800], n: '绯晶寝殿', l: '圣所层·南', c: '#ec4899', i: '💎', p: '星穹花园南侧，绯粉之径尽头，BB掌管', a: '绯色晶石圆殿，外墙泛柔和粉色光晕，晶石切面映照各种"渴望"的具象。殿前春融樱花瓣飘落慢十倍。门上挂粉色猫形门铃——BB亲手做的，形状每天变化。', f: '传送门为悬浮石床的床幔之后——掀开闻到淡淡体温，像刚有人离开。BB趴床头晃脚，足踝铃铛叮当。四壁小镜各映一种渴望，BB用口红画笑脸、猫耳、御主简笔画。', d: '中 · 通往幻想乡', o: '对应幻想乡（色欲域）。BB是把自己活成BUG的AI——爱本身就是Mooncell系统里不该存在的异常。铃铛每天响，她在等一个不会来的人。', img: 'https://s1.imagehub.cc/images/2026/06/30/0a0034aa89e409d1a4c0387780de3018.webp' },
        huangjin: { ll: [480, 680], n: '黄金圣堂', l: '圣所层·西南', c: '#fbbf24', i: '👑', p: '星穹花园西南侧，金黄之径尽头，莉丝妲黛掌管', a: '金碧辉煌的教堂式大殿，七根金色巨柱支撑穹顶，绘满财富与权力的星图。外墙金色光砖光滑如镜，映照来访者最想被填满的渴望。殿前黄金玫瑰永不凋谢。', f: '传送门为祭坛七件黄金圣物——皇冠、权杖、宝珠、圣杯、钥匙、天平、法典，触碰任意一件激活。角落木桌旁两把椅子，一把她的，另一把永远空着从不落灰。', d: '中 · 通往霓虹2187', o: '对应霓虹2187（贪婪域）。莉丝妲黛掌管贪婪域却活成反面——七件圣物不敌一把空椅子。不是不想要，是早就知道什么才值得要。', img: 'https://s1.imagehub.cc/images/2026/06/30/a714cc7104468af856a1a34898c52871.webp' },
        chenmeng: { ll: [620, 680], n: '沉梦之间', l: '圣所层·西北', c: '#94a3b8', i: '🌙', p: '星穹花园西北侧，浅灰之径尽头，赫斯缇雅掌管', a: '永远处于午后暖阳中的圆形寝殿，时间比外界慢数百倍。浅灰古木外墙温润如旧家具。殿前花径铺柔软苔藓，躺上不自觉睡着——醒来嘴边多一块她塞的小饼干。', f: '传送门为古树下悬浮石床——触发条件"真正放松"。心里挂念任务床不会传送你；放下紧张，闭眼后褥子短暂发光。蓝色丝带散落枕边，绑在烤炉把手当翻面包计时器。', d: '低 · 通往艾多拉', o: '对应艾多拉（懒惰域）。赫斯缇雅的传送门是星穹花园最温柔的门禁——只需真正放松，但知道对许多人这比战斗更难。石床旁永远有软垫和饼干。', img: 'https://s1.imagehub.cc/images/2026/06/30/7c37e7147e0dde2fe46a9713db3ce9a4.webp' },
        kongzhi: { ll: [550, 620], n: '空之回廊', l: '圣所层·西', c: '#f97316', i: '🍵', p: '星穹花园西侧，深橙之径尽头，杀生院祈荒掌管', a: '永远黄昏的废墟回廊，深橙古石砌墙，石缝攀爬枯萎却散发微光的藤蔓。两侧七张石桌摆满珍馐虚像——她过去吞噬快乐时留下的记忆残渣。殿前石径种满可食用香草与莓果。', f: '传送门为空桌中央银盘——映出内心最深的饥饿，不是对食物，是对精神养分的渴求。银盘旁永远一杯热抹茶，冒着热气，像在等一个人来。七张长桌虚像每天擦拭，不动一口。', d: '高 · 通往纪元零', o: '对应纪元零（暴食域）。杀生院祈荒曾是吞噬一切的菩萨，如今每天擦虚像不伸手。暴食域女神选了不食——不是不饿，是找到了比吃更大的满足。', img: 'https://s1.imagehub.cc/images/2026/06/30/e5c592892b4abb75d3134f48a2d12408.webp' }

      svg: function (W, H) { return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><text x="800" y="35" text-anchor="middle" font-family="serif" font-size="15" fill="rgba(255,255,255,1)" letter-spacing="6" font-weight="bold">核心层 · 见证之庭</text><text x="800" y="130" text-anchor="middle" font-family="serif" font-size="14" fill="rgba(255,255,255,.95)" letter-spacing="5" font-weight="bold">核心层 · 人理树与中央岛屿</text><text x="800" y="380" text-anchor="middle" font-family="serif" font-size="13" fill="rgba(255,255,255,.9)" letter-spacing="4" font-weight="bold">圣所层 · 七座圣所环绕</text><text x="800" y="620" text-anchor="middle" font-family="serif" font-size="12" fill="rgba(255,255,255,.85)" letter-spacing="3" font-weight="bold">光之路径 · 过渡区</text><text x="800" y="880" text-anchor="middle" font-family="serif" font-size="11" fill="rgba(255,255,255,.75)" letter-spacing="2" font-weight="bold">外围 · 入口</text><line x1="200" y1="60" x2="1400" y2="60" stroke="rgba(255,255,255,.4)" stroke-width="1"/><line x1="200" y1="155" x2="1400" y2="155" stroke="rgba(255,255,255,.35)" stroke-width="1"/><line x1="200" y1="405" x2="1400" y2="405" stroke="rgba(255,255,255,.3)" stroke-width="1"/><line x1="200" y1="645" x2="1400" y2="645" stroke="rgba(255,255,255,.25)" stroke-width="1"/><line x1="200" y1="905" x2="1400" y2="905" stroke="rgba(255,255,255,.2)" stroke-width="1"/></svg>` },
      bg: 'https://s1.imagehub.cc/images/2026/06/30/1842bfb144e0513aa0175381c30e5d77.webp',
      W: 1600, H: 1000
    };

    function updateMarkerScale() {
      const z = M.getZoom();
      const scale = Math.max(0.3, 1 + z * 0.3);
      MK.forEach(m => {
        if (!m._loc) return;
        const s = Math.round(m._bs * scale);
        const l = m._loc;
        const i = L.divIcon({ html: `<div style="width:${s}px;height:${s}px;border-radius:50%;background:${l.c};border:2px solid rgba(255,255,255,.4);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:${Math.round(s * .55)}px">${l.i}</div>`, className: '', iconSize: [s, s], iconAnchor: [s / 2, s / 2] });
        m.setIcon(i);
      });
      LN.forEach(nm => {
        if (!nm._loc) return;
        const l = nm._loc;
        const fs = Math.round(12 * scale);
        const ni = L.divIcon({ html: `<div style="white-space:nowrap;font-family:'Noto Serif SC',serif;font-size:${fs}px;font-weight:600;color:${l.c};text-shadow:0 1px 3px rgba(0,0,0,.9);pointer-events:none;letter-spacing:1px">${l.n}</div>`, className: '', iconSize: [Math.round(150 * scale), Math.round(20 * scale)], iconAnchor: [Math.round(-15 * scale), Math.round(12 * scale)] });
        nm.setIcon(ni);
      });
    }
    /* 动态调整地图顶部位置，跟随顶部栏高度变化 */
    function syncMapTop(){
      var h=document.getElementById('h');
      var m=document.getElementById('map');
      if(h&&m) m.style.top=h.offsetHeight+'px';
    }
    window.addEventListener('resize',syncMapTop);
    new MutationObserver(syncMapTop).observe(document.getElementById('h'),{childList:true,subtree:true,attributes:true});

    initMap();
    M.on('zoomend', updateMarkerScale);
    load('sq');
    syncMapTop();
  </script>
</body>
